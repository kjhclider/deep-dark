/* ════════ 1막의 뼈대: 장(章)과 목표, 정해진 날의 대습격 ════════
   참고한 틀: They Are Billions(정해진 날의 큰 파도와 예고), Total War 캠페인(장별 목표), Mount&Blade(패배의 대가) */
const CHAPTERS=[
  {id:"prep",   n:"1장 준비",  goal:()=>"7일째까지 왕국을 준비하라 — 그때까지 망자의 대군은 오지 않는다(떠도는 작은 무리는 온다)", done:()=>S.day>=7},
  {id:"border", n:"2장 국경",  goal:()=>`망자 요새 하나를 무너뜨려라 (${razedForts()}/1)`, done:()=>razedForts()>=1},
  {id:"counter",n:"3장 반격",  goal:()=>`요새 셋을 무너뜨려라 (${razedForts()}/3) — 왕좌로 가는 길이 열린다 (50일째엔 억지로 열린다)`, done:()=>razedForts()>=3},
  {id:"throne", n:"4장 왕좌",  goal:()=>"망자의 왕좌를 쳐라 — 1막의 끝", done:()=>SITES.some(s=>s.kind==="throne"&&S.sites[s.id].state==="razed")},
  {id:"after",  n:"후일담",    goal:()=>{const d=AFTER_GOALS.filter(g=>g.ok()).length;return `왕국 재건 목표 ${d}/${AFTER_GOALS.length} — 도움말 '이기고 지는 법'에서 본다`;}, done:()=>false},
];
function razedForts(){return SITES.filter(s=>s.kind==="fortress"&&S.sites[s.id].state==="razed").length;}
function chapterIdx(){if(CHAPTERS[3].done())return 4;let i=0;while(i<CHAPTERS.length-1&&CHAPTERS[i].done())i++;return i;}
function chapter(){return CHAPTERS[chapterIdx()];}
function throneOpen(){return razedForts()>=3||S.day>=50;}
// 대습격: 20일째부터 20일마다. 사흘 전에 전령이 알린다. 파도마다 커진다
const SURGE_EVERY=20,SURGE_FIRST=20;
// 대습격 규모: 첫 파도 약 3,000명, 파도마다 +15%. 요새를 무너뜨릴수록 줄어든다 (요새 하나당 약 -9%)
// 난이도: 보통(예전 기준) · 어려움(기본) · 악몽
// 난이도는 하나: 망자 한 명 한 명은 세지지 않고, 날이 갈수록 오는 수가 늘어난다
const DIFF={std:{n:"기본",tier:0,tmax:1,surge:1.12,raid:[8,11],take:1}};
const diff=()=>DIFF.std;
const SURGE_K=1;   // 대습격: 무리마다 30% 더 많다
const surgeCount=w=>{const all=SITES.filter(s=>s.kind==="fortress").length||1,act=SITES.filter(s=>s.kind==="fortress"&&S.sites[s.id].state==="active").length;return Math.round(32*diff().surge*(1+(w-1)*0.6)*(0.45+0.55*act/all));};
/* 대습격 규모 표시: 이미 출발했으면 실제 군세, 사흘 전 계획이 섰으면 그 계획, 그 전엔 지금 병종 비율로 낸 추정 */
const surgeMen=w=>{const live=S.armies&&S.armies.filter(a=>a.side===1&&a.surge===w);if(live&&live.length)return Math.round(live.reduce((m,a)=>m+compMen(a.comps),0)/10)*10;
  if(S.camp&&S.camp.plan&&S.camp.plan.w===w)return S.camp.plan.men;
  const avg=0.55*U.ghoul.men*SURGE_K+0.25*U.goblin.men*SURGE_K+0.13*U.orc.men*SURGE_K+0.035*U.troll.men+0.035*U.necro.men;return Math.round(surgeCount(w)*avg/10)*10;};
function nextSurgeDay(){if(S.day<=SURGE_FIRST)return SURGE_FIRST;return SURGE_FIRST+Math.ceil((S.day-SURGE_FIRST)/SURGE_EVERY)*SURGE_EVERY;}
function campaignDay(){
  S.camp=S.camp||{ch:0,warned:0,surges:0};afterDay();try{realmRaidTick();}catch(e){}
  // 장이 바뀌면 전령
  const ci=chapterIdx();if(ci!==S.camp.ch){S.camp.ch=ci;const c=CHAPTERS[ci];
    const text=ci===1?"첫 이레가 지났다. 북쪽 요새의 성문이 열리고 망자가 걸어 나온다. 이제부터는 요새를 하나씩 무너뜨려야 한다 — 요새가 서 있는 한 망자는 끝없이 온다.":
      ci===2?"요새 하나가 무너졌다. 망자 왕이 분노했다 — 남은 요새가 더 세게 증원되고 두목들이 직접 나선다. 요새 셋을 무너뜨리면 왕좌로 가는 길이 열린다.":
      ci===3?"세 요새가 무너지고 왕좌가 드러났다. 망자 왕은 마지막 군세를 왕좌 둘레에 모은다. 준비가 되면 쳐라.":"";
    if(text)herald(c.n,text);UI.dirty=true;}
  // 대습격 예고와 실행
  const nd=nextSurgeDay();
  if(S.day===nd-3&&S.camp.warned!==nd){S.camp.warned=nd;S.camp.plan=surgePlanBuild(nd,(S.camp.surges||0)+1,null);const P=S.camp.plan;if(P)herald("망자 왕의 군세가 모인다",`첩자들이 북쪽에서 같은 말을 전한다 — ${nd}일째, 사흘 뒤 왕궁으로 대습격이 온다. ${surgePlanText(P)} 지금 왕궁엔 ${fmtN(compMen(S.garrison))}명이 있다. 성벽을 올리고 마을 수비군을 불러들이고 이웃에 원군을 청하라.`,"너희의 성벽은 내 군대의 계단이 될 것이다.",[{n:`${siteById(P.from).name} 보기`,a:"site:"+P.from}]);}
  if(S.day===nd-3||S.day===nd-2){try{lordSurgePlan(nd);}catch(e){}}
  if(S.day===nd-1)surge();   // 전날 하루 거리에서 나타나 대습격 당일에 닿는다
}
// 대습격 계획: 사흘 전에 정하고 그대로 온다 (어디서·무엇이·몇 명)
function surgePlanBuild(nd,w,LS){let forts=SITES.filter(s=>s.kind==="fortress"&&S.sites[s.id].state==="active");if(!forts.length)forts=SITES.filter(s=>s.kind==="throne"&&S.sites[s.id].state==="active");if(!forts.length)return null;
  const f=(LS&&forts.find(s=>s.id===LS.from))||forts.reduce((b,s)=>!b||S.sites[s.id].garrison.length>S.sites[b.id].garrison.length?s:b,null);const st=S.sites[f.id];
  const want=surgeCount(w);const types=st.garrison.filter(c=>c.t!=="troll"&&c.t!=="necro").slice(-Math.floor(want/2)).map(c=>c.t);
  while(types.length<want){const r=Math.random();types.push(LS?lordMixPick(LS.mix):r<0.55?"ghoul":r<0.8?"goblin":r<0.93?"orc":pick(["troll","necro"]));}
  return {nd,w,from:f.id,types,men:types.reduce((a,t)=>a+U[t].men*(t==="troll"||t==="necro"?1:SURGE_K),0),why:LS?LS.why:null,taunt:LS?LS.taunt:null,claude:!!LS};}
function surgePlanText(P){const by={};for(const t of P.types)by[t]=(by[t]||0)+1;const f=siteById(P.from),cap=siteById("capital");const dir=Math.abs(f.x-cap.x)<Math.abs(f.z-cap.z)*0.5?"북쪽":f.x<cap.x?"북서쪽":"북동쪽";
  return `${f.name}(${dir})에서 한 무리로 온다 — 모두 약 ${fmtN(P.men)}명: ${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${U[t].n} ${fmtN(n*U[t].men)}`).join(" · ")}.`;}
function surge(){
  let forts=SITES.filter(s=>s.kind==="fortress"&&S.sites[s.id].state==="active");if(!forts.length)forts=SITES.filter(s=>s.kind==="throne"&&S.sites[s.id].state==="active");if(!forts.length)return;
  S.camp.surges=(S.camp.surges||0)+1;const w=S.camp.surges;
  const ndx=nextSurgeDay?nextSurgeDay():S.day+1;let P=S.camp.plan&&S.camp.plan.nd===ndx&&S.sites[S.camp.plan.from]&&S.sites[S.camp.plan.from].state==="active"?S.camp.plan:null;if(!P)P=surgePlanBuild(ndx,w,lordSurgePick(ndx));if(!P)return;
  const LS=P.claude?{why:P.why,taunt:P.taunt}:null;const f=siteById(P.from),st=S.sites[f.id];const out=[];
  // 계획대로: 요새 주둔군에서 먼저 뽑고, 모자라면 요새 밖에서 새로 일어난다
  /* 요새를 비우지 않는다: 수비의 3분의 1까지만 데려가고 나머지는 요새 밖 땅에서 새로 일어난다 (예전엔 대습격 뒤 요새가 텅 비어 거저 먹혔다) */
  let takeMax=Math.floor(st.garrison.length/3);for(const t of P.types){const k=takeMax>0?st.garrison.findIndex(c=>c.t===t):-1;if(k>=0){out.push(...st.garrison.splice(k,1));takeMax--;}else out.push({t,men:U[t].men});}
  for(const c of out)if(c.t!=="troll"&&c.t!=="necro")c.men=Math.round(c.men*SURGE_K);   // 대습격 무리는 더 빽빽하다
  S.camp.plan=null;
  const tier=zombieTier();for(const c of out)c.tier=tier;
  const cap=siteById("capital");const dx=f.x-cap.x,dz=f.z-cap.z,l=Math.hypot(dx,dz)||1;const tmp={comps:out,side:1,slow:1};const dist=Math.min(l-20,armySpeed(tmp)*0.95);
  const a=spawnArmy(1,out,cap.x+dx/l*dist,cap.z+dz/l*dist,{mission:"raid",target:cap.id,from:f.id});a.surge=w;if(LS)a.lordWhy=LS.why;setDest(a,cap.x,cap.z);revealAt(a.x,a.z,80);WR.fogDirty=true;
  const eta=etaDays(a,cap.x,cap.z);
  logMsg(`대습격! ${f.name}에서 나온 망자 ${fmtN(compMen(out))}이(가) 왕궁 코앞까지 왔다. 내일 닿는다.`,"bad");
  herald(`제${w}차 대습격`,`${f.name}의 성문이 활짝 열렸다. ${compsText(out,true)}. 그들은 밤새 행군해 이미 하루 거리까지 왔다 — 내일 왕궁에 닿는다. 마을의 수비군을 불러들이고, 이웃에 원군을 청하고, 성벽 위에 궁병을 세워라.`,LS&&LS.taunt?LS.taunt:pick(["왕관을 내놓아라. 그러면 백성은 살려 두마 — 나의 군대로.","이번엔 사흘을 주었다. 다음엔 주지 않겠다."]));
  UI.dirty=true;
}
// 상단 표시용 한 줄
function campaignLine(){const c=chapter();const nd=nextSurgeDay();const d=nd-S.day;const wv=(S.camp&&S.camp.surges||0)+(d<=1&&S.camp&&S.camp.surges&&S.armies.some(a=>a.side===1&&a.surge===S.camp.surges)?0:1);const zt=typeof zombieTier==="function"?zombieTier():1;return `${c.n} · ${c.goal()}${zt>1.02?` · <span title="망자는 7일째부터 날마다 질겨진다 (체력·공격)">망자 강화 ×${zt.toFixed(2)}</span>`:""}${typeof goalBarTick==="function"?"":(S.day>=7&&d<=5&&d>0?` · <b style="color:var(--blood)">대습격 D-${d} · 약 ${fmtN(surgeMen(wv))}명</b>`:S.day<7?"":` · 다음 대습격 ${nd}일째 (약 ${fmtN(surgeMen(wv))}명)`)}`;}

// 1막 뒤 자유 통치 목표: 이룰 때마다 명성
const AFTER_GOALS=[
  {id:"forts",n:"남은 요새를 모두 무너뜨린다",ok:()=>SITES.filter(s=>s.kind==="fortress").every(s=>S.sites[s.id].state!=="active")},
  {id:"vils",n:"모든 마을을 되살린다",ok:()=>SITES.filter(s=>s.kind==="village").every(s=>S.sites[s.id].state==="ok")},
  {id:"ally",n:"이웃 왕국 둘과 동맹(관계 70)",ok:()=>Object.values(S.realms||{}).filter(r=>r.alive&&r.rel>=70).length>=2},
  {id:"pop",n:"백성 6,000",ok:()=>S.civ>=6000},

];
function afterDay(){if(!S.won)return;S.afterDone=S.afterDone||{};for(const g of AFTER_GOALS)if(!S.afterDone[g.id]&&g.ok()){S.afterDone[g.id]=1;S.renown=(S.renown||0)+2;const n=Object.keys(S.afterDone).length;herald("재건의 이정표",`${g.n} — 이루었다. 명성 +2. (${n}/${AFTER_GOALS.length})`+(n===AFTER_GOALS.length?" 아스테라는 다시 일어섰다. 연대기는 그대를 재건왕이라 부를 것이다.":""));}}

/* 망자는 우리보다 훨씬 많다 — 이웃 왕국도 며칠마다 친다. 이웃 군대가 막거나 무너지고, 우리 군대가 가서 도우면 관계가 오른다 */
function realmRaidTick(){if(!S||S.practice||S.day<9)return;S.camp.nextRealmRaid=S.camp.nextRealmRaid||ri(9,12);if(S.day<S.camp.nextRealmRaid)return;S.camp.nextRealmRaid=S.day+ri(4,7);
  const live=REALMS.filter(r=>S.realms[r.id]&&S.realms[r.id].alive);if(!live.length)return;const r=pick(live);
  const tgs=realmSites(r).filter(s=>s&&S.sites[s.id]&&S.sites[s.id].state==="ok");if(!tgs.length)return;const tg=tgs.find(s=>s.kind==="rvillage")&&Math.random()<0.7?pick(tgs.filter(s=>s.kind==="rvillage")):pick(tgs);
  const forts=SITES.filter(s=>(s.kind==="fortress"||s.kind==="throne")&&S.sites[s.id].state==="active");if(!forts.length)return;const f=forts.reduce((b,s)=>!b||Math.hypot(s.x-tg.x,s.z-tg.z)<Math.hypot(b.x-tg.x,b.z-tg.z)?s:b,null);
  const n=Math.max(3,Math.round((500+S.day*30)/200));const out=[];for(let i=0;i<n;i++){const r2=Math.random(),t=r2<0.5?"ghoul":r2<0.78?"goblin":r2<0.95?"orc":"troll";out.push({t,men:U[t].men,tier:zombieTier()});}
  const a=spawnArmy(1,out,f.x,f.z+14,{mission:"raid",target:tg.id,from:f.id});setDest(a,tg.x,tg.z);const eta=etaDays(a,tg.x,tg.z);
  logMsg(`${f.name}에서 망자 ${fmtN(compMen(out))}이(가) 이웃 ${r.name}의 ${tg.name}(으)로 향한다. 약 ${eta}일 뒤 닿는다 — 군대를 보내 도우면 관계가 오른다.`,"bad");
  /* 이웃이 우리에게 원군을 청한다 (사이가 나쁘면 청하지 않는다) */
  const R2=S.realms[r.id],defM=R2.army.reduce((m,c)=>m+c.men,0);
  if(R2.rel>=0)herald(`${r.name}의 원군 요청`,`${r.name}의 전령이 숨을 몰아쉬며 들어왔다. "${f.name}의 망자 ${fmtN(compMen(out))}이(가) 우리 ${tg.name}(으)로 오고 있습니다. 약 ${eta}일 뒤면 닿습니다. 저희 군대는 ${fmtN(defM)}뿐입니다 — 부디 군대를 보내 주십시오." ${S.camp.realmRaidSaid?"":"망자는 우리만 노리지 않는다. 이웃 군대가 막지 못하면 마을이 무너지고, 수도가 무너지면 그 왕국은 사라진다. "}망자가 닿기 전에 우리 군대를 ${tg.name} 근처에 세워 두면 함께 싸운다 — 이기면 관계가 크게 오르고 사례금을 받는다. 거절해도 벌은 없지만, 무너진 이웃은 다시 돕지 못한다.`,null,[{n:"원군 보내기",a:"rescue:"+tg.id},{n:"지도에서 본다",a:"army:"+a.id}]);
  S.camp.realmRaidSaid=1;
  UI.dirty=true;}

/* ════════ 망자의 군주 = Claude (시험판) ════════
   대습격·침공·전투 계략을 Claude가 정한다. 지난 전투의 기억과 왕의 버릇(병종 구성·성벽·원정)을 보고 약한 곳을 노린다.
   응답이 없거나 꺼져 있으면 기본 규칙대로 움직인다. 호출은 결정 순간에만 (하루 몇 번 이하) */
function lordOn(){return typeof AI!=="undefined"&&AI.ok();}   // 망자의 군주는 늘 Claude가 지휘한다 (연결이 끊긴 순간에만 기본 규칙으로 버틴다)
function lordMemAdd(e){S.lordMem=(S.lordMem||[]).concat([e]).slice(-8);}
function lordBase(t){return ({einf:"inf",espear:"spear",earcher:"archer",ecav:"cav",militia:"inf",guard:"cav",royal:"inf"})[t]||t;}
// 왕의 버릇: 병종 비율·정예·성벽·원정
function lordProfile(){
  const all=[...S.garrison,...S.armies.filter(a=>a.side===0).flatMap(a=>a.comps)];const by={};let tot=0,el=0;
  for(const c of all){const b=lordBase(c.t);by[b]=(by[b]||0)+c.men;tot+=c.men;if(/^e/.test(c.t))el++;}
  const pct=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,m])=>`${U[t]?U[t].n:t} ${Math.round(m/Math.max(1,tot)*100)}%`).join(", ");
  const vw=SITES.filter(s=>s.kind==="village"&&S.sites[s.id].state==="ok").map(s=>`${s.name}(성벽${S.sites[s.id].walls||0}, 수비 ${compMen(S.sites[s.id].vgar||[])}명)`).join(", ");
  const away=S.armies.filter(a=>a.side===0&&a.moving).map(a=>`${compMen(a.comps)}명→${missionName(a)}`).join(" / ")||"없음";
  return `인간 병력 총 ${fmtN(tot)}명 (${pct||"없음"}), 정예 중대 ${el}개. 왕궁 성벽 ${S.bld.walls}단계, 왕궁 주둔 ${fmtN(compMen(S.garrison))}명. 마을: ${vw||"없음"}. 이동 중인 인간 군대: ${away}. 무너진 요새 ${typeof razedForts==="function"?razedForts():0}곳.`;
}
function lordMemText(){const m=S.lordMem||[];if(!m.length)return "아직 기억할 전투가 없다.";
  return m.map(e=>`- ${e.day}일 ${e.what}: 계략 ${e.tac||"-"} → ${e.win?"인간 승리":"망자 승리"} (인간 손실 ${e.lost}명, 망자 손실 ${e.kills}명)${e.note?" · "+e.note:""}`).join("\n");}
const LORD_RULES=`병종: ghoul 구울(약하고 많음, 쓰러진 시체로 불어남), goblin 고블린(빠름, 궁병 사냥), orc 오크(보병 상대로 강함), troll 트롤(성벽·보병 파괴, 창병에 약함), wolf 늑대기수(가장 빠름, 우회), necro 강령술사(시체를 일으킴, 기병에 약함).
인간 상성: 궁병은 구울·고블린에 강하고 근접에 약하다, 창병은 트롤·늑대에 강하다, 기병은 강령술사·고블린에 강하다, 보병은 오크에 맞선다.`;

/* ── 전투 계략: 전투가 정해지는 순간 묻고, 배치 중에 답이 오면 그 계략으로 싸운다 ── */
function lordBattleTactic(){
  if(!lordOn()||!WAR||!WAR.foeComps||!WAR.foeComps.length)return;const w=WAR;
  const siege=w.kind==="siege"||w.kind==="vsiege";
  const ours=Object.entries(countBy(w.ourComps||[])).map(([t,n])=>`${U[t]?U[t].n:t}×${n}`).join(", ");
  const foes=Object.entries(countBy(w.foeComps)).map(([t,n])=>`${t}×${n}`).join(", ");
  const opts=siege?["rush (전면 돌격)","breach (트롤·오크를 가장 약한 성벽 한 곳에 모은다)"]:["rush (정면 돌격)","pincer (좌우로 갈라 협공)","hunt (빠른 부대가 우회해 궁병만 노림)","wedge (트롤·오크를 가장 약한 부대 한 곳에)","reserve (30%를 숨겼다가 20초 뒤 옆구리로 투입)","feint (선봉이 물러났다 사기 올려 되돌아옴)"];
  const p=`너는 판타지 전략 게임의 망자 군단 지휘관이다. 인간 왕을 꺾을 이번 전투의 계략 하나를 골라라. 냉혹하고 영리하게, 인간의 약점을 찔러라.
전투: ${w.title} (${siege?"인간의 성을 공격":w.kind==="assault"?"인간이 너의 요새를 공격":"들판의 회전"})${siege?`, 성벽 ${w.kind==="siege"?S.bld.walls:(vil(w.site)||{}).walls||0}단계`:""}
인간 군: ${ours||"알 수 없음"}
너의 군: ${foes}
${LORD_RULES}
인간 왕에 대해 아는 것: ${lordProfile()}
지난 전투의 기억 (같은 수에 또 당하지 말고, 통했던 수는 변주하라):
${lordMemText()}
고를 수 있는 계략: ${opts.join(" / ")}
JSON 하나로만 답하라: {"tactic":"영문 키","why":"이 계략을 고른 이유 한 문장(한국어)","cry":"싸움 직전 망자 군주의 짧고 섬뜩한 외침(한국어)"}`;
  w.lordAsk=true;
  AI.json(p,{modelTier:"quick"}).then(r=>{
    const k=String(r&&r.tactic||"").toLowerCase().trim();if(!TACTICS[k]||WAR!==w)return;
    if(siege&&k!=="rush"&&k!=="breach")return;
    w.lordTac={k,why:String(r.why||"").slice(0,160),cry:String(r.cry||"").slice(0,100)};
    // 이미 싸움이 시작됐어도 척후가 알리기 전이면 계략을 바꾼다
    if(BT&&WAR===w&&!BT.tacSaid&&BT.tac){for(const s of BT.sq)if(s.side===1){if(s.role==="reserve")s.lateT=0;s.role=null;s.flankTried=false;s.flank=null;}BT.tac=null;assignTactic();}
  }).catch(e=>AI.fail(e));
}

/* ── 대습격: 예고하는 날 묻는다 — 어느 요새에서, 어떤 병종 위주로 ── */
function lordSurgePlan(nd){
  if(!lordOn()||!S.camp||S.camp.lordAskFor===nd)return;S.camp.lordAskFor=nd;
  const forts=SITES.filter(s=>s.kind==="fortress"&&S.sites[s.id].state==="active");if(!forts.length)return;
  const cap=siteById("capital");
  const p=`너는 망자 군단의 군주다. ${nd}일째에 인간 왕국의 왕궁(${cap.x},${cap.z})으로 대습격을 보낸다. 어느 요새에서 출발하고 어떤 병종 위주로 채울지 정하라. 인간 군의 약점을 노려라.
너의 요새: ${forts.map(s=>`${s.id}=${s.name}(${s.x},${s.z}, 주둔 ${S.sites[s.id].garrison.length}개 중대)`).join(", ")}
${LORD_RULES}
인간 왕에 대해 아는 것: ${lordProfile()}
지난 전투의 기억:
${lordMemText()}
mix는 새로 일으킬 병력의 비율(합 1): ghoul, goblin, orc, troll, wolf 중에서.
JSON 하나로만 답하라: {"from":"요새 id","mix":{"ghoul":0.4,"goblin":0.3,"orc":0.2,"troll":0.1},"why":"이 선택의 이유 한 문장(한국어)","taunt":"인간 왕에게 보내는 섬뜩한 한 문장(한국어)"}`;
  AI.json(p,{modelTier:"default"}).then(r=>{
    const f=forts.find(s=>s.id===(r&&r.from));if(!f)return;const mix={};let t=0;
    for(const k of ["ghoul","goblin","orc","troll","wolf"]){const v=Math.max(0,+((r.mix||{})[k])||0);if(v){mix[k]=v;t+=v;}}
    if(t<=0)return;for(const k in mix)mix[k]/=t;
    // 트롤은 아무리 원해도 3할까지
    if((mix.troll||0)>0.3){const x=mix.troll-0.3;mix.troll=0.3;mix.ghoul=(mix.ghoul||0)+x;}
    S.camp.lordSurge={nd,from:f.id,mix,why:String(r.why||"").slice(0,160),taunt:String(r.taunt||"").slice(0,120)};
    // 계획이 바뀌면 첩자가 다시 알린다

const BF={W:240,D:170,DEPLOY:38};   // 전장: x -120~120, z -85~85, 아군은 남쪽(+z)

/* ── 전장 지형 ── */
function bHraw(B,x,z){let h=Noise.fbm(x*0.012+B.seed,z*0.012,4)*2.4;for(const k of B.hills){const d=Math.hypot(x-k.x,(z-k.z)*k.rx);h+=k.h*Math.exp(-(d*d)/(k.r*k.r));}
  for(const p of (B.pools||[])){const d=Math.hypot(x-p.x,z-p.z);if(d<p.r+4)h=lerp(h,-0.6,smooth(p.r+4,p.r*0.7,d));}return h;}
function bH(x,z){return BT?bHraw(BT,x,z):0;}
function onHill(x,z){return BT.hills.some(k=>Math.hypot(x-k.x,(z-k.z)*k.rx)<k.r*0.75);}
function inForest(x,z){return BT.forests.some(f=>Math.hypot(x-f.x,z-f.z)<f.r);}

/* ── 부대(중대) ── */
let SQID=0;
function mkSquad(t,side,men,x,z,ref){
  const u=U[t],[cols,sp]=FORM[t],F=Math.max(1,Math.round(u.figs*men/u.men)),rows=Math.ceil(F/cols);
  const tier=(side===1&&ref&&ref.tier||1)*(side===1&&t==="troll"&&typeof WAR!=="undefined"&&WAR&&WAR.site==="f_gul"?1.3:1);const s={id:++SQID,t,side,x,z,face:side===0?Math.PI:0,men0:men,pool:men*u.hp*tier,tier,hpk:tier,alive:men,morale:100,state:"idle",tx:x,tz:z,target:null,hold:false,
    cd:rnd(0,u.rate),figs:[],perFig:men/F,runT:0,chargeT:0,engaged:false,buff:{},kills:0,lost:0,routT:0,think:rnd(0,1.2),flankT:0,healT:2,raiseT:rnd(3,6),purT:3,
    fled:false,dead:false,ref,flank:null,hitT:0,label:null,vet:ref&&ref.vet||0,follow:null,fo:null,elite:!!(ref&&ref.elite),fat:ref&&ref.fat||0};
  if(side===0&&typeof S!=="undefined"&&S)s.morale=Math.min(100,65+S.morale*0.35);   // 민심이 곧 병사의 시작 사기
  if(s.elite){s.pool*=1.1;s.morale=100;}
  for(let i=0;i<F;i++){const c=i%cols,r=Math.floor(i/cols);const j=side===1?sp*0.35:0.3;s.figs.push({ox:(c-(Math.min(cols,F)-1)/2)*sp+rnd(-j,j),oz:(r-(rows-1)/2)*sp+rnd(-j,j),x,z,alive:true,ph:rnd(0,6),lunge:0,vi:i,clip:null,t0:0});}
  for(const f of s.figs){const p=figPos(s,f);f.x=p.x;f.z=p.z;}
  return s;
}
// 진형 좌표: face 방향이 앞(+oz 가 뒤)
const FORM_SC={line:1,tight:0.72,loose:1.65};
const formSc=s=>FORM_SC[s.form||"line"];
function figPos(s,f){
  // 성벽 위 궁병: 성벽 통로를 따라 두 줄로 늘어선다
  if((s.onWall&&wallCrew(s)||s.escTop)&&typeof BT!=="undefined"&&BT&&BT.wall&&onWallTop(s)){const a=wAng(s.x,s.z),T=WALL_T(),n=s.figs.length,cols=Math.ceil(n/2),col=f.vi%cols,row=Math.floor(f.vi/cols);const b=wPt(a,T*(row?0.66:0.3)),o=(col-(cols-1)/2)*1.05;return {x:b.x+Math.cos(a)*o,z:b.z+Math.sin(a)*o};}
  const fx=Math.sin(s.face),fz=Math.cos(s.face),k=formSc(s)*(s.buff&&(s.buff.shield||s.buff.brace)?0.75:1);   // 방패막·창벽: 어깨를 붙여 촘촘히 선다
  return {x:s.x+(fz*f.ox-fx*f.oz)*k,z:s.z+(-fx*f.ox-fz*f.oz)*k};}
const aliveFigs=s=>Math.ceil(s.alive/s.perFig-1e-6);
const sqHp=s=>U[s.t].hp*(s.elite?1.1:1)*(s.hpk||1);   // hpk: 망자 티어·두목 배율 (병사 수는 늘지 않고 한 명이 질겨진다)
const sqR=s=>Math.sqrt(Math.max(1,aliveFigs(s)))*FORM[s.t][1]*0.62*formSc(s)+1.4;
const act=s=>!s.dead&&!s.fled;
const isRng=t=>U[t].rng>20;
const FORT_TRAIT={f_mor:{n:"끝없는 북소리",d:"망자 사기가 계속 회복된다 — 측면·두목으로 한 번에 무너뜨려라"},f_kal:{n:"강령술사의 첨탑",d:"시체가 두 배 빨리 일어난다 — 강령술사부터 베라"},f_gul:{n:"트롤의 협곡",d:"트롤이 30% 더 질기고 세게 친다 — 창병의 창벽으로 받아라"},f_ash:{n:"검은 연기",d:"연기 때문에 우리 궁병 사거리 -18% — 보병·기병으로 붙어라"},f_crag:{n:"구울 소굴",d:"절벽 굴에서 22초마다 구울이 새로 나온다(최대 6번) — 빨리 끝내라"},f_maw:{n:"쇠이빨 성문",d:"오크 좀비 공격 +25% — 궁병으로 깎고 정예보병으로 받아라"},f_throne:{n:"망자의 왕",d:"왕이 시체를 깨우고 광폭해진다 — 왕을 노려라"}};
const BASE_T={einf:"inf",espear:"spear",earcher:"archer",ecav:"cav"};const baseT=t=>BASE_T[t]||t;
const bOurs=()=>BT.sq.filter(s=>s.side===0);
const bFoes=()=>BT.sq.filter(s=>s.side===1&&act(s));

/* ── 전투 준비 ── */
function setupBattle(ctx){

    gen:ctx.gen?genById(ctx.gen):null,hills:[],forests:[],wallBonus:0,auto:false};
  const fortWall=ctx.kind==="assault"&&ctx.site&&ctx.site!=="f_throne"&&siteById(ctx.site)&&siteById(ctx.site).kind==="fortress";   // 망자 요새 공략: 둥근 돌 성벽을 우리가 친다
  Object.assign(CW,ctx.kind==="vsiege"?{x:0,z:0,R:46,n:16,full:true,gateA:0,ac:0}:fortWall?{x:0,z:-80,R:52,n:11,full:false,gateA:Math.PI,ac:Math.PI}:{x:0,z:84,R:70,n:11,full:false,gateA:0,ac:0});
  if(fortWall){B.wall=makeWall(2);B.wall.fort=true;B.wallAtk=0;B.wallDef=1;}
  if(ctx.kind==="siege"||ctx.kind==="vsiege"){const lvl=ctx.kind==="siege"?S.bld.walls:(S.sites[ctx.site].walls||0);B.wall=makeWall(lvl);B.wall.village=ctx.kind==="vsiege";B.wallAtk=1;B.wallDef=0;B.wallBonus=0;/* 성벽 단계마다 아군 피해 -12% */if(ctx.kind==="siege"&&S.wallCrack){for(const sg of B.wall.segs){sg.hp*=0.75;sg.max*=0.75;}S.wallCrack=false;}}
  const tp=terrainPlan(ctx.kind,ctx.site||(ctx.nearSite||null),r);B.hills=tp.hills;B.forests=tp.forests;B.pools=tp.pools;B.terrain=tp.T;
  if(B.wall){B.stairs=B.wall.segs.filter(g=>!g.gate&&g.i%3===1).map(g=>g.a0+(g.a1-g.a0)*0.3);}   // 성벽 안쪽 계단: 세 구간마다 하나
  if(B.wall){const far=o=>wIn(o.x,o.z)<-22;B.hills=B.hills.filter(far);B.pools=B.pools.filter(far);B.forests=B.forests.filter(f=>wIn(f.x,f.z)<-(f.r||10)-8);}
  BT=B;planReinforcements(B,ctx);
  B.fort=ctx.kind==="assault"&&FORT_TRAIT[ctx.site]?ctx.site:null;
  // 아군
  const ourComps=ctx.ourComps;
  const front=[],back=[],wing=[];
  ourComps.forEach(c=>{if(c.men<=0)return;(c.t==="cav"||c.t==="ecav"?wing:isRng(c.t)?back:front).push(c);});
  const row=(arr,z)=>arr.forEach((c,i)=>B.sq.push(mkSquad(c.t,0,c.men,(i-(arr.length-1)/2)*17,z,c)));
  if(ctx.kind==="siege"||ctx.kind==="vsiege"){
    // 수비 배치: 궁병·성직자는 성벽 위, 보병·창병은 성문 안쪽, 기병은 뒤에서 대기
    // 원형 성: 궁병은 북쪽 반원 성벽 위에 고루(성문 바로 위는 비운다), 보병·창병은 성문 안쪽 광장, 기병은 성 한가운데

/* ── 성벽: 성을 빙 둘러싼 원형 성벽. 망자는 성벽을 부수거나, 사다리를 걸거나, 무너진 틈·성문으로만 들어온다 ──

  const max=(lvl===0?650:900+lvl*1100)*(gate?0.7:1)*(S.tech?1+0.2*S.tech.wall:1);segs.push({i,ac,a0:ac-st/2,a1:ac+st/2,hp:max,max,gate});}return {lvl,segs};}

  BT.kingDown=true;setTimeout(()=>{if(BT&&E.camMode==="tp"&&!BT.over)toggleBattleView(false);},2500);BT.genDead=true;for(const s of bOurs())if(act(s))s.morale-=15;if(BT.heroGen){const gd=genById(BT.heroGen);bSay(`${gd?gd.name:"장군"}이(가) 쓰러졌다! 근위대가 끌어낸다 — 이제 전체 시점에서 지휘한다`);BT.log.push("장군 쓰러짐");}else{bSay("왕이 쓰러졌다! 친위대가 왕을 끌어낸다 — 이제 전체 시점에서 지휘한다");BT.log.push("왕 부상");}
  if(BR.king&&BR.king.userData.hero)heroOnce(BR.king,KCLIP.death,0.1,1);}

// 왕은 적 병사 사이를 뚫고 지나가지 못한다: 살아 있는 적 병사(인형) 하나하나에 부딪힌다
function bKingPush(x,z){const R0=KC.mounted?1.1:0.55;for(const s of BT.sq){if(s.side!==1||!act(s)||Math.abs(s.x-x)>sqR(s)+6||Math.abs(s.z-z)>sqR(s)+6)continue;
    const big=s.t==="troll"?1.2:0.4;
    for(const f of s.figs){if(!f.alive)continue;const fx=f.x,fz=f.z;const dx=x-fx,dz=z-fz,d=Math.hypot(dx,dz),m=R0+big;
      if(d<m&&d>1e-4){x=fx+dx/d*m;z=fz+dz/d*m;}}}
  if(BT.engines)for(const e of BT.engines){if(e.hp<=0&&!e.ram)continue;const er=(e.ram?3.4:2.8)+R0,dx=x-e.x,dz=z-e.z,d=Math.hypot(dx,dz);if(d<er&&d>1e-4){x=e.x+dx/d*er;z=e.z+dz/d*er;}}   // 투석기·충차는 왕도 지나가지 못한다
  return {x,z};}

function nearestBreachOk(s){const b=nearestBreach(s);return !!b&&b.d<120;}

// 망자·병사의 실제 걸음 배율 (언덕·늪·버프) — 인형이 부대 속도보다 빨리 달려가지 않게
function speedK(s){const v=speedOf(s),b=U[s.t].spd||1;return v>0?v/b:0.5;}
// 인형끼리 겹치지 않게: 모든 부대의 살아 있는 인형을 1.5m 격자에 넣고 가까운 것끼리 밀어낸다 (같은 편·다른 편 모두)
const _sepG=new Map();
// 인형 몸통 반지름: 서로 이만큼은 떨어져 선다 (겹쳐 보이지 않게)
const FIG_R=s=>s.t==="troll"?2.4:(U[s.t].tags.includes("cavalry")||s.t==="guard")?1.45:0.68;
function separateFigs(B){_sepG.clear();const cs=1.6,key=(i,j)=>i*4096+j;const all=[];
  for(const s of B.sq){if(s.fled||s.dead)continue;const rad=FIG_R(s);
    for(const f of s.figs){if(!f.alive||f.hy>0)continue;f._r=rad;f._s=s;const i=Math.floor(f.x/cs)+2048,j=Math.floor(f.z/cs)+2048,k=key(i,j);let c=_sepG.get(k);if(!c){c=[];_sepG.set(k,c);}c.push(f);all.push(f);}}
  for(const f of all){const i=Math.floor(f.x/cs)+2048,j=Math.floor(f.z/cs)+2048;const R=Math.ceil((f._r+2.0)/1.6);
    for(let a=-R;a<=R;a++)for(let b=-R;b<=R;b++){const c=_sepG.get(key(i+a,j+b));if(!c)continue;for(const g of c){if(g===f)continue;const dx=f.x-g.x,dz=f.z-g.z,d2=dx*dx+dz*dz,m=f._r+g._r;if(d2<m*m&&d2>1e-6){const d=Math.sqrt(d2),pu=(m-d)*(g._r>f._r*1.5?0.6:0.4);f.x+=dx/d*pu;f.z+=dz/d*pu;}}}}
  // 투석기·충차는 지나갈 수 없다
  if(B.engines)for(const e of B.engines){if(e.hp<=0&&!e.ram)continue;const er=e.ram?3.4:2.8;for(const f of all){const dx=f.x-e.x,dz=f.z-e.z,d=Math.hypot(dx,dz),m=er+f._r;if(d<m&&d>1e-4){f.x=e.x+dx/d*m;f.z=e.z+dz/d*m;}}}}

// 가장 가까운 적 인형 (separateFigs가 만든 격자 사용). 짝이 넘친 적(일반 2, 트롤 4)은 건너뛴다
function figNearFoe(f,side,r,load){const cs=1.6,n=Math.ceil(r/cs),i0=Math.floor(f.x/cs)+2048,j0=Math.floor(f.z/cs)+2048;let b=null,bd=r*r;
  const wl=BT.wall,fin=wl?wIn(f.x,f.z)>0:0;
  for(let a=-n;a<=n;a++)for(let c=-n;c<=n;c++){const L=_sepG.get((i0+a)*4096+(j0+c));if(!L)continue;for(const g of L){if(g._s.side===side||!g.alive||g.hy>0)continue;if(wl&&(wIn(g.x,g.z)>0)!==fin&&wallUp((f.x+g.x)/2,(f.z+g.z)/2))continue;const cap=g._s.t==="troll"?4:g._r>0.9?3:2;if(load&&(load.get(g)||0)>=cap)continue;const d=(g.x-f.x)**2+(g.z-f.z)**2;if(d<bd){bd=d;b=g;}}}
  return b;}

// 트롤 앞세우기: 트롤이 살아 있는 동안 나머지 망자(늑대·강령술사 빼고)는 트롤보다 앞서지 않고 그 걸음에 맞춰 뒤따른다.
// 트롤이 적과 맞붙거나 성벽에 닿거나, 성벽이 뚫리거나, 45초가 지나면 모두 풀려 돌격한다
function trollLead(B){if(B.wall&&B.wallAtk===0){for(const s of B.sq)s.leadK=undefined;return;}const tr=B.sq.filter(s=>s.side===1&&s.t==="troll"&&act(s));
  const ours=B.sq.filter(s=>s.side===0&&act(s));const front=s=>B.wall?Math.max(0,-wIn(s.x,s.z)):Math.min(...ours.map(q=>dd(s,q)-sqR(q)),999);
  const on=B.leadOn!==false&&tr.length&&ours.length&&B.t<45&&!tr.some(s=>s.engaged)&&!(B.wall&&B.wall.segs.some(g=>g.hp<=0));
  if(!on){if(B.leadOn!==false&&B.leadSaid){B.leadOn=false;}for(const s of B.sq)s.leadK=undefined;return;}
  const lead=Math.min(...tr.map(front));if(lead<4){B.leadOn=false;for(const s of B.sq)s.leadK=undefined;return;}
  if(!B.leadSaid&&B.t>3){B.leadSaid=true;if(!B.headless)bSay("트롤이 앞장서고 망자가 그 뒤에 숨어 따라온다 — 궁병으로 트롤을 먼저 노려라");}
  const tsp=U.troll.spd*0.98;
  for(const s of B.sq){if(s.side!==1||s.t==="troll"||s.t==="wolf"||s.t==="necro"||s.engaged||!act(s)){s.leadK=undefined;continue;}
    const near=Math.min(...ours.map(q=>dd(s,q)-sqR(q)-sqR(s)),999);if(near<22){s.leadK=undefined;continue;}   // 이미 적이 가까우면 기다리지 않고 싸운다
    const d=front(s);s.leadK=d<lead+10?0:Math.min(1,tsp/(U[s.t].spd||tsp));}}

// 궁병의 시야: 성벽 위에서는 자기 앞쪽 바깥(성벽 방향 ±50°)만 보인다. 성 안 땅에 선 궁병은 성벽 너머를 못 본다
function canSee(s,e){if(!BT.wall||!e)return true;
  // 공격 쪽(성 밖) 궁병: 성벽 위와 성벽 바로 안쪽까지만 넘겨 쏜다 — 성 깊숙한 곳은 성벽에 가려 안 보인다
  if(s.side===BT.wallAtk){if(wIn(s.x,s.z)>0)return true;const we=wIn(e.x,e.z);if(we<=0)return true;if(angD(wAng(s.x,s.z),wAng(e.x,e.z))>0.9)return false;return we<WALL_T()+14||!segUp(segAtA(wAng(e.x,e.z)));}
  if(s.side!==BT.wallDef)return true;const ei=wIn(e.x,e.z)>0,si=wIn(s.x,s.z)>0;
  if(onWallTop(s)){if(ei)return true;return angD(wAng(s.x,s.z),wAng(e.x,e.z))<0.87;}
  if(si&&!ei&&segUp(segAt(e.x,e.z)))return false;return true;}

const B_wallAtkIs=k=>BT&&BT.wall&&BT.wallAtk===k;
// 사다리 꼭대기를 지키는 쪽이 있는가: 성벽 위 궁병, 또는 성벽 바로 안쪽에 선 수비 무리
function wallDefNear(s){return BT.sq.some(q=>act(q)&&q.side===BT.wallDef&&q.state!=="rout"&&(onWallTop(q)||(wIn(q.x,q.z)>0&&wIn(q.x,q.z)<WALL_T()+9))&&Math.hypot(q.x-s.x,q.z-s.z)<sqR(q)+18);}

// 망자가 요새를 지킬 때: 성 안으로 넘어온 우리 병사부터 치고, 뚫린 곳·사다리가 걸린 성벽·충차가 붙은 성문 쪽 안쪽에 나눠 선다
function fortDefThink(s){const B=BT;if(wIn(s.x,s.z)<=0)return false;
  const inside=bOurs().filter(q=>act(q)&&q.state!=="rout"&&wIn(q.x,q.z)>0&&!acrossWall(s,q)&&onWallTop(q)===onWallTop(s));
  const crew=wallCrew(s)&&s.onWall;
  if(inside.length){const t=inside.reduce((b,q)=>!b||dd(s,q)<dd(s,b)?q:b,null);if(dd(s,t)<(crew?16:70)&&!(crew&&isRng(s.t))){s.target=t.id;s.state="attack";s.flank=null;s.think=0.8;if(crew&&!isRng(s.t))s.onWall=false;return true;}}
  if(crew){// 성벽 위 수비: 보이는 적이 있으면 그 자리에서 쏘고 던진다, 없으면 성벽을 따라 적이 오는 쪽으로 옮긴다
    const a=wAng(s.x,s.z);if(!onWallTop(s)){let A=a;const sg=segAtA(a);if(!segUp(sg)||sg.back){const g=B.wall.segs.filter(q=>segUp(q)&&!q.gate).sort((p,q)=>angD(p.ac,a)-angD(q.ac,a))[0];if(!g){s.onWall=false;return false;}A=g.ac;}const p=wPt(A,1.4);s.state="move";s.tx=p.x;s.tz=p.z;s.target=null;s.think=0.6;return true;}
    const out=bOurs().filter(q=>act(q)&&wIn(q.x,q.z)<0);const vis=out.filter(q=>angD(wAng(q.x,q.z),a)<0.9&&dd(s,q)<(isRng(s.t)?rangeOf(s):46)).sort((p,q)=>dd(s,p)-dd(s,q));
    if(vis.length){s.state="idle";s.target=isRng(s.t)?vis[0].id:null;s.think=0.8;return true;}
    if(out.length){let best=null,bd=9;for(const q of out){const d=angD(wAng(q.x,q.z),a)+dd(s,q)*0.002;if(d<bd){bd=d;best=q;}}const df=Math.atan2(Math.sin(wAng(best.x,best.z)-a),Math.cos(wAng(best.x,best.z)-a));
      if(Math.abs(df)>0.5){const na=a+clamp(df,-0.4,0.4),sg=segAtA(na);if(sg&&segUp(sg)){const p=wPt(na,1.4);s.state="move";s.tx=p.x;s.tz=p.z;s.target=null;s.think=1.2;return true;}}}
    s.state="idle";s.target=null;s.think=1;return true;}
  if(isRng(s.t))return false;
  if(!B.fdT||B.t-B.fdT>1){B.fdT=B.t;const th=[];const gate=B.wall.segs.find(g=>g.gate);
    for(const g of B.wall.segs)if(g.hp<=0||(g.gate&&B.gateOpen))th.push({a:g.ac,w:3});
    for(const q of bOurs())if(act(q)&&q.lad&&wIn(q.x,q.z)<0&&wIn(q.x,q.z)>-30)th.push({a:wAng(q.x,q.z),w:1});
    const ram=(B.engines||[]).find(e=>e.ram&&e.hp>0);if(gate&&gate.hp>0&&ram&&wIn(ram.x,ram.z)>-30)th.push({a:gate.ac,w:1.5});
    // 비슷한 각도의 위협은 하나로 묶는다(사다리 둘이 붙어 있으면 한 곳)
    th.sort((p,q)=>p.a-q.a);const tm=[];for(const t of th){const l=tm[tm.length-1];if(l&&angD(l.a,t.a)<0.22){l.a=(l.a*l.w+t.a*t.w)/(l.w+t.w);l.w+=t.w;}else tm.push({a:t.a,w:t.w});}
    const fs=B.sq.filter(q=>q.side===1&&act(q)&&!isRng(q.t)&&q.t!=="necro"&&wIn(q.x,q.z)>0).sort((p,q)=>p.id-q.id);const prev=B.fdA||{};B.fdA={};B.fdPos={};
    for(const f of fs)if(!f.home)f.home={x:f.x,z:f.z};
    if(tm.length){const load=tm.map(()=>0),grp=tm.map(()=>[]);
      // 가까운 무리부터 가까운 위협을 맡는다(멀리 요새를 가로질러 뛰지 않는다). 맡던 곳은 웬만하면 그대로
      const pairs=[];for(const f of fs)tm.forEach((t,i)=>{const p=wPt(t.a,9),d=Math.hypot(p.x-f.x,p.z-f.z);if(d<48)pairs.push([d-(prev[f.id]!==undefined&&angD(prev[f.id],t.a)<0.3?30:0),f,i]);});
      pairs.sort((p,q)=>p[0]-q[0]);const took=new Set();for(const [d,f,i] of pairs){if(took.has(f.id)||load[i]>=Math.ceil(1.3*tm[i].w))continue;took.add(f.id);load[i]++;grp[i].push(f);B.fdA[f.id]=tm[i].a;}
      // 같은 곳을 맡은 무리들은 성벽을 따라 나란히, 넘치면 한 줄 뒤에 선다 (한 점에 겹치지 않게)
      grp.forEach((g,i)=>{g.sort((p,q)=>wAng(p.x,p.z)-wAng(q.x,q.z));const per=3;g.forEach((f,k)=>{const row=Math.floor(k/per),col=k%per,n=Math.min(per,g.length-row*per);const off=(col-(n-1)/2)*(sqR(f)*2+3),dep=8+sqR(f)+row*(sqR(f)*2+3);
        const p=wPt(tm[i].a+off/Math.max(8,CW.R-dep),dep);B.fdPos[f.id]=p;});});}}
  const p=(B.fdPos&&B.fdPos[s.id])||s.home;if(!p)return false;const dp=Math.hypot(p.x-s.x,p.z-s.z);
  // 다른 무리에 막혀 더 못 가면 그 자리에서 버틴다(제자리 뜀·겹침 방지)
  if(s.state==="move"&&s.fdP===p){if(dp<s.fdBest-0.8){s.fdBest=dp;s.fdT0=B.t;}else if(B.t-s.fdT0>3){s.state="idle";s.home={x:s.x,z:s.z};if(B.fdPos)B.fdPos[s.id]=s.home;s.think=2;return true;}}
  if(dp>3){if(s.state!=="move"||s.fdP!==p){s.state="move";s.tx=p.x;s.tz=p.z;s.fdP=p;s.fdBest=dp;s.fdT0=B.t;}}else{s.state="idle";s.home={x:p.x,z:p.z};}s.target=null;s.flank=null;s.think=0.8;return true;}

// 성벽 건너편으로 갈 때: 뚫린 곳(또는 열린 성문)을 지나서 간다 — 성벽 둘레를 따라 돌고, 틈 앞에서 건너간다
function viaBreach(s,tx,tz){if(!BT.wall)return {x:tx,z:tz};const si=wIn(s.x,s.z)>0,ti=wIn(tx,tz)>0;if(si===ti)return {x:tx,z:tz};
  const b=nearestBreach(s);if(!b)return null;const a=wAng(s.x,s.z),df=Math.atan2(Math.sin(b.a-a),Math.cos(b.a-a)),side=si?1:-1;
  if(Math.abs(df)>0.1)return wPt(a+Math.sign(df)*Math.min(Math.abs(df),0.45),side*(sqR(s)+8));
  return wPt(b.a,-side*(sqR(s)+8));}

// 양쪽의 실제 힘 (병력×체력×공격, 우리 병사 강함 배율 반영)
function sidePow(sd){return BT.sq.filter(s=>s.side===sd&&act(s)&&s.state!=="rout").reduce((a,s)=>a+s.alive*U[s.t].hp*U[s.t].atk*(sd===0?OUR_K*OUR_K:1),0);}

// 사다리 꼭대기에 올라선 무리: 먼저 성벽 위 통로에서 가까운 궁병·투척병과 칼부림을 한다. 근처에 없거나 12초가 지나면 성 안으로 뛰어내린다
function escTopThink(s){const B=BT;if(!B.wall||!onWallTop(s)||B.t>(s.escTopT||0)){s.escTop=false;s.stairUp=false;const p=wPt(wAng(s.x,s.z),WALL_T()+4);s.x=p.x;s.z=p.z;s.tx=p.x;s.tz=p.z;s.wIn0=wIn(s.x,s.z);if(!B.headless)for(const f of s.figs)if(f.alive){f.hy=wallH();f.vy=1;}return false;}
  const a=wAng(s.x,s.z);const t=B.sq.filter(q=>act(q)&&q.side===B.wallDef&&onWallTop(q)&&angD(wAng(q.x,q.z),a)<(s.stairUp?9:0.3)).sort((p,q)=>angD(wAng(p.x,p.z),a)-angD(wAng(q.x,q.z),a))[0];
  if(!t){s.escTopT=Math.min(s.escTopT,B.t+1);s.think=0.5;return true;}
  const A=wAng(t.x,t.z),p=wPt(A,WALL_T()*0.5);s.target=t.id;s.state="attack";s.tx=p.x;s.tz=p.z;s.think=0.5;return true;}

// ── 성벽 안쪽 계단 ──
function stairsUp(){return (BT.stairs||[]).filter(A=>{const g=segAtA(A);return g&&segUp(g)&&!g.back;});}
function nearStair(a){const L=stairsUp();let b=null,bd=9;for(const A of L){const d=angD(A,a);if(d<bd){bd=d;b=A;}}return b;}
// 성벽 위로 가야 하는 궁병(성 안 땅에 있을 때): 가장 가까운 계단 아래로 가서 계단으로 올라선다
function stairStep(s){const B=BT;if(!B||!B.wall||!B.stairs||s.side!==B.wallDef||!wallCrew(s)||!s.onWall||s.state==="rout")return;
  const T=WALL_T(),w=wIn(s.x,s.z);if(w<=T+1.4||(s.state!=="move"&&s.state!=="idle"))return;
  const goalA=s.tx!==undefined?wAng(s.tx,s.tz):wAng(s.x,s.z),A=s.stairA??nearStair(wAng(s.x,s.z)*0.5+goalA*0.5);if(A===null||A===undefined){s.onWall=false;return;}s.stairA=A;
  const base=wPt(A,T+6);if(Math.hypot(base.x-s.x,base.z-s.z)>2.5){if(!s.fin||s.state==="idle")s.fin={x:s.tx??s.x,z:s.tz??s.z};s.state="move";s.tx=base.x;s.tz=base.z;return;}
  const top=wPt(A,T*0.5);s.x=top.x;s.z=top.z;s.stairA=null;const f=s.fin;s.fin=null;if(f&&wIn(f.x,f.z)<T+1.4&&wIn(f.x,f.z)>-1){s.tx=f.x;s.tz=f.z;s.state="move";}else{s.tx=top.x;s.tz=top.z;s.state="idle";}}
// 성 안에 들어온 공격 쪽 근접병: 땅에 싸울 적이 없고 성벽 위에 적(궁병 등)만 남았으면 계단으로 올라가 친다
function stairThink(s){const B=BT;if(!B.stairs||s.escTop||isRng(s.t)||s.t==="troll"||s.t==="necro"||s.state==="rout"||U[s.t].tags.includes("cavalry"))return false;
  const T=WALL_T();if(wIn(s.x,s.z)<T+1)return false;

  if(B.sq.some(q=>act(q)&&q.side===B.wallDef&&!onWallTop(q)&&q.state!=="rout"&&wIn(q.x,q.z)>0&&dd(s,q)<45))return false;
  const tg=tops.reduce((b,q)=>!b||dd(s,q)<dd(s,b)?q:b,null);const L=stairsUp();if(!L.length)return false;
  const A=L.reduce((b,a)=>{const p=wPt(a,T+6),pb=wPt(b,T+6);return Math.hypot(p.x-s.x,p.z-s.z)+angD(a,wAng(tg.x,tg.z))*CW.R*0.5<Math.hypot(pb.x-s.x,pb.z-s.z)+angD(b,wAng(tg.x,tg.z))*CW.R*0.5?a:b;},L[0]);

  else if(act_==="retreat"){const z0=BF.DEPLOY+26;const cx=sq.reduce((a,s)=>a+s.x,0)/sq.length;
    sq.forEach((s,i)=>{s.follow=null;s.hold=false;s.flank=null;s.target=null;s.state="move";s.orderT=BT.t;s.holdT=BT.t+15;s.retreatT=BT.t+6;s.engaged=false;s.buff.brace=0;s.tx=clamp(s.x*0.5+cx*0.5,-110,110);s.tz=clamp(z0+(isRng(s.t)?10:0),-80,83);
      if(BT.wall&&BT.wallDef===0){// 우리 성: 성 안으로 물러난다 (궁병은 성벽 위로, 밖에 있으면 성문·틈을 지나)
        if(wIn(s.x,s.z)>0){const p=isRng(s.t)?wPt(wAng(s.x,s.z),1.4):wPt(wAng(s.x,s.z),18);s.tx=p.x;s.tz=p.z;if(isRng(s.t))s.onWall=true;}
        else{const p0=wPt(wAng(s.x,s.z),18),p=viaBreach(s,p0.x,p0.z)||wPt(wAng(s.x,s.z),-30);s.tx=p.x;s.tz=p.z;}}
      else if(BT.wall){// 공성 중: 성벽에서 멀리, 우리 진영 쪽으로 (성 안에 들어가 있으면 뚫린 곳으로 나온다)
        const a=wAng(s.x,s.z);if(wIn(s.x,s.z)>0){const p0=wPt(a,-40),p=viaBreach(s,p0.x,p0.z)||p0;s.tx=p.x;s.tz=p.z;}else{const p=wPt(a,-45);s.tx=clamp(p.x,-110,110);s.tz=clamp(p.z,-80,83);}}});bSay(`${G.n}, 물러나라!`);sfx("drum",0.7);}
  else if(act_==="skill2"){const ck=k+"2",cd=BT.gcd[ck]||0;if(cd>BT.t){bSay(`${G.sk2}: ${Math.ceil(cd-BT.t)}초 뒤에 다시 쓸 수 있다`);return;}BT.gcd[ck]=BT.t+G.cd2;skillTip(G,2);
    const near=(s,r)=>{const fs=bFoes().filter(f=>dd(s,f)<r);const top=BT.wall&&BT.wallAtk===s.side?fs.filter(onWallTop):[];return (top.length?top:fs).sort((p,q)=>dd(s,p)-dd(s,q))[0];};   /* 공성 중 투창은 성벽 위 망자부터 */
    if(k==="inf"){for(const s of sq){bPop(s,"밀어붙여라!","good");s.buff.push=8;s.buff.shield=0;delete s.buff.shield;const t=near(s,60)||ourAutoTarget(s);if(t){s.state="attack";s.target=t.id;s.hold=false;s.orderT=BT.t;}}bSay("보병, 방패로 밀어붙여라!");}
    else if(k==="spear"){let n=0;for(const s of sq){const t=near(s,30);if(!t)continue;n++;const big=t.t==="troll"||t.t==="wolf";{const dm=s.alive*7*(big?1.6:1);BT.pend.push({at:BT.t+0.85,fn:()=>{if(act(t))bDamage(s,t,dm);}});}for(let i=0;i<6;i++)BT.proj.push({x0:s.x+rnd(-4,4),z0:s.z+rnd(-2,2),x1:t.x+rnd(-4,4),z1:t.z+rnd(-4,4),t0:BT.t+rnd(0,0.25),dur:0.75,k:"jav",h0:0});}
      if(!n){BT.gcd[ck]=BT.t+3;bSay("투창: 30m 안에 적이 없다");return;}bSay(`창병, 던져라! (${n}개 중대)`);}
    else if(k==="archer"){const fs=bFoes();let best=null,bs=-1;for(const f of fs){let sum=0;for(const g of fs)if(dd(f,g)<14)sum+=g.alive;if(sum>bs){bs=sum;best=f;}}
      if(!best){BT.gcd[ck]=BT.t+3;bSay("쏠 적이 없다.");return;}const pw=sq.reduce((a,s)=>a+s.alive,0),bx=best.x,bz=best.z;BT.pend.push({at:BT.t+1.4,fn:()=>{BT.fires=(BT.fires||[]).concat([{x:bx,z:bz,t:10,t0:10,pw,src:sq[0].id}]);if(!BT.headless){E.shake=Math.max(E.shake||0,0.08);try{sfx("flesh",0.6);}catch(e){}}}});for(const f of fs)if(Math.hypot(f.x-best.x,f.z-best.z)<14)f.morale=Math.max(0,f.morale-10);
      for(const s of sq){bPop(s,"불화살!","good");for(let i=0;i<14;i++)BT.proj.push({x0:s.x+rnd(-4,4),z0:s.z+rnd(-3,3),x1:best.x+rnd(-11,11),z1:best.z+rnd(-11,11),t0:BT.t+rnd(0,0.35),dur:1.1,k:"fire",h0:onWallTop(s)?wallH():0});}bSay(`궁병, 불화살! (망자 ${fmtN(bs)} 밀집)`);}
    else if(k==="cav"){for(const s of sq){bPop(s,"돌파!","good");const t=near(s,90)||ourAutoTarget(s);s.buff.trample=6;if(t){s.state="attack";s.target=t.id;s.hold=false;s.flank=null;s.orderT=BT.t;}}bSay("기마병, 꿰뚫어라!");}
    else if(k==="all"){for(const s of bOurs())if(act(s)){bPop(s,"전열 정비","good");s.buff.steady=10;s.morale=Math.min(100,s.morale+10);}BT.fx.push({k:"ring",x:cmdPos().x,z:cmdPos().z,t0:BT.t,dur:1.4,col:"#9dbbe0"});bSay("전군, 전열을 다잡아라!");}
    sfx(k==="inf"?"order":k==="spear"?"volley":k==="archer"?"volley":k==="cav"?"hooves":"rally",0.9);}
  else if(act_==="skill"){const cd=BT.gcd[k]||0;if(cd>BT.t){bSay(`${G.sk}: ${Math.ceil(cd-BT.t)}초 뒤에 다시 쓸 수 있다`);return;}BT.gcd[k]=BT.t+G.cd;skillTip(G,1);
    if(k==="inf"){for(const s of sq){bPop(s,"방패막!","good");s.buff.shield=12;s.state="idle";s.target=null;s.tx=s.x;s.tz=s.z;s.orderT=BT.t+4;}bSay("보병, 방패막을 세워라!");}

    else if(k==="archer"){const fs=bFoes();let best=null,bs=-1;for(const f of fs){let sum=0;for(const g of fs)if(dd(f,g)<20)sum+=g.alive;if(sum>bs){bs=sum;best=f;}}
      if(best){BT.focusOn={id:best.id,until:BT.t+8};for(const s of sq){bPop(s,"집중 사격!","good");s.buff.focus=8;s.target=best.id;s.state="idle";s.orderT=BT.t+8;}BT.fx.push({k:"ring",x:best.x,z:best.z,t0:BT.t,dur:1.4,col:"#e8c46a"});bSay(`궁병, 저기에 화살을 퍼부어라! (망자 ${fmtN(bs)} 밀집)`);}else bSay("쏠 적이 없다.");}
    else if(k==="cav"){const fs=bFoes().filter(f=>f.t!=="troll");const big=fs.sort((a,b)=>b.alive-a.alive)[0]||bFoes()[0];
      if(big){const side=(sq[0].x<big.x)?-1:1;for(const s of sq){bPop(s,"측면 돌격!","good");s.buff.hornLite=8;s.hold=false;s.state="attack";s.target=big.id;s.orderT=BT.t+3;s.flank={x:clamp(big.x+side*30,-115,115),z:clamp(big.z-6,-80,80)};}bSay("기마병, 옆구리를 쳐라!");}}

    sfx(k==="inf"||k==="spear"?"shieldwall":k==="archer"?"volley":k==="cav"?"hooves":"rally",0.9);}
  UI.battleDirty=true;}
function grpPanelHtml(){if(!BT||BT.phase!=="battle")return "";const cur=BT.grp||"all";const ky=(G,c)=>cur===G.k?`<kbd>${c}</kbd>`:"";BT.gcd=BT.gcd||{};

// 불화살 불길: 매 순간 반경 안 망자를 태운다
function grpTick(dt){if(!BT||!BT.fires||!BT.fires.length)return;
  for(const F of BT.fires){F.t-=dt;const sd=F.side||0,src=bById(F.src)||BT.sq.find(q=>q.side===sd),R=F.r||14;
    for(const f of BT.sq)if(act(f)&&f.side!==sd&&Math.hypot(f.x-F.x,f.z-F.z)<R+sqR(f)*0.5&&src)bDamage(src,f,F.pw*(sd===0?0.11:0.02)*dt*(U[f.t].tags.includes("light")?1.3:1));
    if(sd===1&&BT.engines)for(const e of BT.engines)if(e.side===0&&e.hp>0&&Math.hypot(e.x-F.x,e.z-F.z)<R+3){e.hp-=(e.ram?9:6)*dt;if(e.hp<=0&&!e.deadT){e.hp=0;e.deadT=BT.t;bSay(e.ram?"충차가 불길에 타 버렸다!":"투석기가 불에 탔다!");BT.log.push(e.ram?"아군 충차 소실":"아군 투석기 소실");}}
    if(!BT.headless&&Math.random()<dt*10)BT.fx.push({k:"dust",x:F.x+rnd(-12,12),z:F.z+rnd(-12,12),t0:BT.t,dur:0.8,col:"#ff7a2a"});}
  BT.fires=BT.fires.filter(F=>F.t>0);}

// 병종 고르기: 고른 병종의 부대가 전장에서 밝게 빛나고(선택), 지휘판에 '지휘 중'이 크게 뜬다 — 단축키가 누구에게 가는지 늘 보이게
function grpSelect(k){if(!BT)return;const G=GROUPS.find(g=>g.k===k);if(!G)return;BT.grp=k;const sq=k==="all"?bOurs().filter(s=>act(s)&&s.state!=="rout"&&!s.isKing):grpSquads(k);BT.sel=new Set(sq.map(s=>s.id));

// 기술을 처음 쓰면: 무엇이 바뀌고 화면에서 무엇이 보이는지 알려 준다
const SKILL_SEE={inf1:"보병 발밑에 금빛 고리가 생기고 병사들이 어깨를 붙여 촘촘히 선다. 그 자리에서 버틴다.",inf2:"주황 고리와 함께 보병이 가장 가까운 적에게 방패로 밀고 들어간다.",

  cav1:"기병이 크게 돌아 가장 큰 적 무리의 옆구리로 파고든다.",cav2:"붉은 고리와 함께 기병이 정면의 적을 꿰뚫고 지나간다 — 구울·고블린 같은 가벼운 적에게 특히 세다.",
  all1:"모든 부대에 금빛 고리가 뜨고 북소리와 함성이 울린다.",all2:"모든 부대에 하늘빛 고리가 뜨고 물러서지 않고 버틴다."};
function skillTip(G,i){if(typeof tipOnce!=="function")return;const n=i===1?G.sk:G.sk2,d=i===1?G.skd:G.skd2,cd=i===1?G.cd:G.cd2;
  tipOnce("sk_"+G.k+i,`${G.n} — ${n}`,`${d}<br><b>화면에서</b> ${SKILL_SEE[G.k+i]||""}<br><b>다시 쓰기</b> ${cd}초 뒤 (지휘판 버튼에 남은 초가 뜬다)`);}

/* ════════ 성 공방전: 망자의 역할 · 사다리 · 투석기 · 돌 던지기 ════════
   망자는 역할을 나눠 성을 친다.
   · 성벽 깨기(트롤): 가장 약한 성벽 구간 하나를 두드려 무너뜨린다
   · 성문 부수기(오크 절반·늑대): 성문으로 몰려가 문을 부순다
   · 사다리(구울·고블린·나머지 오크): 성벽 곳곳에 사다리를 걸고 줄지어 오른다. 꼭대기에서 수비병에게 밀려 떨어지거나, 비어 있으면 넘어와 안에서 싸운다
   · 사다리가 모자라면 뒤에서 기다린다 (아무 데나 성벽에 박치기하지 않는다)
   · 투석기(망자): 뒤편에서 성벽과 성 안으로 돌을 날린다 — 기병을 내보내 부숴라
   · 투석기(우리): 성 안에서 가장 빽빽한 망자 무리로 돌을 날린다. 성벽 위 병사는 아래로 돌을 던진다 */
const LADDER_MAX=16;      // 동시에 걸 수 있는 사다리 자리(한 자리에 사다리 둘)
const isEngineT=t=>t==="engine";

function siegeRoles(B){if(!B.wall||B.wallAtk===0)return null;   // 우리가 치는 공성전이면 우리 역할은 siegeRolesOurs
  const fs=B.sq.filter(s=>s.side===1&&act(s)&&s.t!=="necro");
  const segs=B.wall.segs.filter(g=>!g.gate&&g.hp>0);
  const gateA=(B.wall.segs.find(g=>g.gate)||{ac:0}).ac;
  // 트롤: 약하고(체력 비율 낮고) 트롤 무리에 가까운 구간 하나로 모인다
  const tr=fs.filter(s=>s.t==="troll");
  if(tr.length){const mx=tr.reduce((a,s)=>a+s.x,0)/tr.length,mz=tr.reduce((a,s)=>a+s.z,0)/tr.length,ma=wAng(mx,mz);
    const g=segs.slice().sort((a,b)=>(a.hp/a.max+angD(a.ac,ma)*0.8)-(b.hp/b.max+angD(b.ac,ma)*0.8))[0];
    for(const s of tr){s.role="breach";s.focusA=g?g.ac:ma;}}
  let oi=0;const lad=[];
  for(const s of fs){if(s.t==="troll")continue;
    if(s.t==="wolf"||(s.t==="orc"&&(oi++)%2===0)){s.role="gate";s.focusA=gateA+rnd(-0.06,0.06);continue;}
    s.role="ladder";lad.push(s);}
  // 사다리 무리는 성벽을 따라 퍼진다(성문 바로 옆은 피한다)
  lad.sort((a,b)=>wAng(a.x,a.z)-wAng(b.x,b.z));
  let vt=null;
  if(CW.full){// 마을(둥근 성): 사방 포위 · 약한 곳(성벽 위 궁병이 적은 쪽) · 정면 중 하나
    const cover=a=>bOurs().filter(q=>act(q)&&isRng(q.t)&&onWallTop(q)&&angD(wAng(q.x,q.z),a)<0.87).reduce((x,q)=>x+q.alive,0);
    let weakA=0,wc=1e9;for(let i=0;i<24;i++){const a=-Math.PI+(i+0.5)*Math.PI/12;if(angD(a,gateA)<0.25)continue;const c=cover(a);if(c<wc){wc=c;weakA=a;}}
    const mx=fs.reduce((a,s)=>a+s.x,0)/fs.length,mz=fs.reduce((a,s)=>a+s.z,0)/fs.length,arr=wAng(mx,mz);
    const r=Math.random();vt=r<0.4?"vweak":r<0.75?"vsurround":"vfront";B.weakA=weakA;
    lad.forEach((s,i)=>{let a;if(vt==="vsurround")a=-Math.PI+(i+0.5)*Math.PI*2/lad.length;else if(vt==="vweak")a=weakA+(lad.length<=1?0:-0.55+1.1*i/(lad.length-1));else a=arr+(lad.length<=1?0:-1.0+2*i/(lad.length-1));
      if(angD(a,gateA)<0.16)a+=0.2;s.focusA=Math.atan2(Math.sin(a),Math.cos(a));});
    if(tr.length){const ta=vt==="vweak"?weakA:vt==="vfront"?arr:null;if(ta!==null){const g=B.wall.segs.filter(q=>!q.gate).sort((a,b)=>angD(a.ac,ta)-angD(b.ac,ta))[0];for(const s of tr)s.focusA=g.ac;}}}
  else lad.forEach((s,i)=>{let a=-1.35+2.7*(i+0.5)/lad.length;if(Math.abs(a-gateA)<0.16)a+=a<gateA?-0.16:0.16;s.focusA=a;});
  for(const s of fs){s.flankTried=false;s.flank=null;}
  return vt;
}
// 둥근 성 둘레를 돌아서 간다: 목표 각도가 멀면 성벽 바깥 둘레를 따라 조금씩 돈다(성벽을 뚫고 직진하지 않게)
function aroundWall(s,A,off){const a=wAng(s.x,s.z),df=Math.atan2(Math.sin(A-a),Math.cos(A-a));if(Math.abs(df)<0.35)return wPt(A,off);return wPt(a+Math.sign(df)*Math.min(Math.abs(df),0.5),-Math.max(sqR(s)+10,32));}   /* 성벽을 돌아갈 땐 충차·투석기 바깥으로 */
// 사다리 자리 잡기: 성벽에 닿은 사다리 무리만, 자리가 남을 때
function ladderSlot(s){const B=BT;B.ladUsed=B.sq.filter(q=>q.lad&&act(q)&&q.side===s.side).length;if(s.lad)return true;if(B.ladUsed>=LADDER_MAX)return false;s.lad=true;return true;}
// 사다리 무리의 생각: 성벽 쪽 자리로 가서 사다리를 걸고, 자리가 없으면 뒤에서 기다린다
function siegeThink(s){const B=BT;if(!B.wall||s.side!==B.wallAtk)return false;if(s.side===0&&!B.oursRoled)siegeRolesOurs(B);if(!s.role)return false;
  /* 뚫린 곳(성문 포함)이 생겨도 모두 그 한 곳으로 몰려 줄을 서지 않는다: 틈이 자기 사다리 자리보다 확실히 가까운 무리만 틈으로, 이미 사다리를 건 무리는 계속 오른다 */
  const brk=nearestBreach(s);if(brk&&brk.d<120){if(s.role!=="ladder")return false;const sp=wPt(s.focusA,-(sqR(s)+1.4)),ds=Math.hypot(sp.x-s.x,sp.z-s.z);if(s.lad?brk.d<14:brk.d<ds+12)return false;}
  const w=wIn(s.x,s.z);if(w>0)return false;                   // 이미 안에 들어온 무리
  if(s.role==="ladder"){
    if(!s.lad&&B.sq.filter(q=>q.lad&&act(q)&&q.side===s.side).length>=LADDER_MAX){const p=aroundWall(s,s.focusA,-24);s.state="move";s.tx=clamp(p.x,-115,115);s.tz=clamp(p.z,-80,80);s.target=null;s.flank=null;s.think=1.5;return true;}
    /* 이미 성벽에 닿았으면(성문 앞 제외) 맡은 자리를 고집하지 않고 그 자리에 사다리를 건다 */
    if(wIn(s.x,s.z)>-(sqR(s)+5)&&angD(wAng(s.x,s.z),CW.gateA)>0.22&&wallUp(s.x,s.z)&&(s.lad||ladderSlot(s))){s.state="idle";s.target=null;s.flank=null;s.think=0.8;return true;}
    /* 맡은 자리까지 6초 넘게 못 가면(충차·다른 무리에 막힘) 지금 선 곳에 사다리를 건다 — 성벽 앞에서 어리바리하지 않게 */
    if(s.state==="move"){s.ladMoveT=(s.ladMoveT||0)+0.8;if(s.ladMoveT>6&&wIn(s.x,s.z)>-40){let a=wAng(s.x,s.z);if(angD(a,CW.gateA)<0.25)a=CW.gateA+(Math.sin(a-CW.gateA)<0?-0.25:0.25);s.focusA=Math.atan2(Math.sin(a),Math.cos(a));s.ladMoveT=0;}}else s.ladMoveT=0;
    const p=aroundWall(s,s.focusA,-(sqR(s)+1.4));if(Math.hypot(p.x-s.x,p.z-s.z)>4||angD(wAng(s.x,s.z),s.focusA)>0.35){s.state="move";s.tx=clamp(p.x,-115,115);s.tz=clamp(p.z,-80,80);s.target=null;s.flank=null;}
    else{ladderSlot(s);s.state="idle";s.target=null;}
    s.think=0.8;return true;}
  if(s.role==="ram"){const r=(B.engines||[]).find(e=>e.ram&&engAlive(e));if(!r||(B.wall.segs.find(g=>g.gate)||{hp:0}).hp<=0){s.role=null;return false;}
    if(B.sq.some(q=>act(q)&&q.side!==s.side&&wIn(q.x,q.z)<0&&dd(s,q)-sqR(q)<10))return false;   // 덤비는 적은 먼저 친다
    const p={x:r.x-Math.sin(r.face)*5,z:r.z-Math.cos(r.face)*5};if(Math.hypot(p.x-s.x,p.z-s.z)>1.5){s.state="move";s.tx=clamp(p.x,-115,115);s.tz=clamp(p.z,-80,80);}else s.state="idle";s.target=null;s.flank=null;s.think=0.3;return true;}
  if(s.role==="reserve"){// 기병: 성이 뚫릴 때까지 성문 앞 뒤쪽에서 기다린다(성 밖으로 나온 적은 친다)
    if(B.sq.some(q=>act(q)&&q.side!==s.side&&wIn(q.x,q.z)<0&&dd(s,q)-sqR(q)<30))return false;
    const p=wPt(CW.gateA+(s.x>CW.x?-0.7:0.7),-36);if(Math.hypot(p.x-s.x,p.z-s.z)>5){s.state="move";s.tx=clamp(p.x,-115,115);s.tz=clamp(p.z,-80,80);}else s.state="idle";s.target=null;s.think=1;return true;}
  // 이미 성벽에 붙었고 지금 선 곳의 성벽을 칠 수 있으면 그 자리에서 친다 (목표 구간이 남에게 막혀 제자리걸음하지 않게)
  if((s.role==="breach"||s.role==="gate")&&wIn(s.x,s.z)>-(sqR(s)*0.6+3)&&canBash(s,segAt(s.x,s.z))&&(s.role==="breach"||angD(wAng(s.x,s.z),s.focusA)<0.2)){s.state="idle";s.target=null;s.bashing=true;s.think=1;return true;}
  if(s.role==="breach"||s.role==="gate"){const p=aroundWall(s,s.focusA,-(sqR(s)*0.6+0.4));if(Math.hypot(p.x-s.x,p.z-s.z)>3||angD(wAng(s.x,s.z),s.focusA)>0.35){s.state="move";s.tx=clamp(p.x,-115,115);s.tz=clamp(p.z,-80,80);s.target=null;s.flank=null;}else{s.state="idle";s.target=null;s.bashing=true;}s.think=0.8;return true;}
  return false;}
// 성벽 치기: 성벽 깨기·성문 부수기 무리만 (성문 구간이면 누구나)
function canBash(s,sg){return !!sg&&!sg.back&&(s.t==="troll"||s.role==="breach"||(s.role==="gate"&&sg.gate));}   // 성문 부수기 역할·트롤만 친다 (사다리 무리가 문을 두드리지 않는다)

// 사다리 오르기: 무리에서 몇 명씩 올라가 성벽을 넘는다 (넘은 병사는 성 안에 새 무리로 내려선다)
function takeMen(s,n){n=Math.min(n,s.alive);if(n<=0)return 0;const hp=sqHp(s);s.alive-=n;s.pool=Math.max(0,s.pool-n*hp);let rm=aliveFigs(s)<s.figs.filter(f=>f.alive).length?s.figs.filter(f=>f.alive).length-aliveFigs(s):0;
  for(let i=s.figs.length-1;i>=0&&rm>0;i--){const f=s.figs[i];if(f.alive){f.alive=false;rm--;}}if(s.alive<=0){s.dead=true;s.alive=0;}return n;}
function siegeClimb(s,dt){const B=BT;if(!B.wall||s.side!==B.wallAtk||s.role!=="ladder"||isRng(s.t)||U[s.t].tags.includes("cavalry")||!s.lad||s.engaged||s.state==="rout")return;
  const w=wIn(s.x,s.z);if(w>0||w<-(sqR(s)+6)||!wallUp(s.x,s.z)){return;}
  const def=wallDefNear(s);
  const isInf=baseT(s.t)==="inf"||s.t==="militia";   // 보병: 방패를 머리에 이고 가장 빨리, 가장 덜 떨어지며 오른다
  s.climbT=(s.climbT||0)+dt*({orc:1.25,goblin:1.2,ghoul:1}[s.t]||(isInf?1.9:0.85));
  if(s.climbT<3.2)return;s.climbT=0;
  const n=Math.min(s.alive,Math.max(5,Math.round(s.men0*(isInf?0.17:0.13))));
  // 꼭대기에 성벽 위 수비병이 있으면 절반 넘게 밀려 떨어져 죽는다
  const fall=def?Math.round(n*(isInf?0.15:baseT(s.t)==="spear"?0.5:0.5)):Math.round(n*0.1);
  if(fall){bDamage(null,s,sqHp(s)*fall/(s.side===1?OUR_K:1));}
  if(!act(s))return;const up=takeMen(s,n-fall);if(up<=0)return;
  const a=wAng(s.x,s.z),T=WALL_T(),p=wPt(a,T+4);
  // 사다리 꼭대기에 닿은 자들은 먼저 성벽 위 궁병·투척병을 덮친다 (성벽 위 통로에서 칼부림)
  {const cr=B.sq.filter(q=>act(q)&&q.side===B.wallDef&&onWallTop(q)&&angD(wAng(q.x,q.z),a)<0.14).sort((p1,p2)=>angD(wAng(p1.x,p1.z),a)-angD(wAng(p2.x,p2.z),a))[0];
    if(cr){bDamage(s,cr,up*U[s.t].atk*(isInf?0.5:0.3));cr.morale-=4;if(!B.headless){bPop(cr,"사다리로 올라온 적이 덮친다!",cr.side===0?"bad":"good");B.fx.push({k:"dust",x:cr.x,z:cr.z,t0:B.t,dur:0.6});}}}
  let e=B.sq.find(q=>q.esc&&q.escTop&&q.side===s.side&&q.t===s.t&&act(q)&&Math.hypot(q.x-p.x,q.z-p.z)<14&&Math.ceil((q.alive+up)/q.perFig-1e-6)<=q.figs.length);
  if(e){const b0=aliveFigs(e);e.alive+=up;e.pool+=up*sqHp(e);e.men0=Math.max(e.men0,e.alive);let add=aliveFigs(e)-b0;for(const f of e.figs){if(add<=0)break;if(!f.alive){f.alive=true;f.x=p.x+rnd(-2,2);f.z=p.z+rnd(-2,2);f.hy=0.5;f.vy=1;add--;}}}
  else{e=mkSquad(s.t,s.side,up,p.x,p.z,null);e.esc=true;e.escTop=false;e.escTopT=0;e.src=s.id;if(isInf)e.buff.push=12;   /* 교두보: 넘어간 보병은 방패로 밀어붙인다 */if(s.side===0){e.vet=s.vet;e.elite=s.elite;e.gen=null;}e.state="attack";e.morale=100;e.wIn0=wIn(e.x,e.z);if(s.tier)e.hpk=s.hpk;
    if(!B.headless){const wh=wallH();for(const f of e.figs){const q=wPt(a+((f.vi%7)-3)*0.8/CW.R,T*0.5);f.x=q.x;f.z=q.z;f.hy=0.5;f.vy=1+Math.random()*0.8;f.kbx=0;f.kbz=0;}}
    B.sq.push(e);if(typeof ensureCapacity==="function")ensureCapacity();if(!B.headless&&typeof addSqLabel==="function")addSqLabel(e);}
  if(!B.climbSaid||B.t-B.climbSaid>10){B.climbSaid=B.t;bSay(s.side===1?(def?`${U[s.t].n}이(가) 사다리를 오른다 — 성벽 위 궁병이 밀어 떨어뜨린다!`:`${U[s.t].n}이(가) 빈 성벽을 넘어왔다! 성벽 위를 지켜라!`):(def?`${U[s.t].n}이(가) 사다리를 오른다 — 망자가 꼭대기에서 밀어낸다!`:`${U[s.t].n}이(가) 성벽을 넘었다! 안에서 싸운다!`));}
  BT.log.push(`${U[s.t].n} 성벽 넘음`);}

/* ── 투석기 ── */
function setupEngines(B){if(!B.wall)return;B.engines=[];B.booms=[];
  if(B.wallAtk===0){// 우리가 치는 공성전: 우리 투석기 둘(성벽 밖)·충차 하나, 망자 투석기 하나(요새 안)
    for(const sx of [-1,1]){const p=wPt(CW.gateA+sx*0.3,-48);B.engines.push({side:0,atk:true,x:clamp(p.x,-112,112),z:clamp(p.z,-80,80),hp:320,max:320,cd:rnd(3,6),face:Math.atan2(CW.x-p.x,CW.z-p.z),armT:0});}
    {const p=wPt(CW.gateA,-26);B.engines.push({side:0,ram:true,x:p.x,z:p.z,hp:520,max:520,cd:0,face:Math.atan2(CW.x-p.x,CW.z-p.z),armT:0});}
    {const p=(CW.full?wPt(CW.gateA+Math.PI,CW.R*0.7):wPt(CW.gateA,CW.R*0.8));B.engines.push({side:1,x:p.x,z:p.z,hp:260,max:260,cd:rnd(6,9),face:0,armT:0});}
    return;}
  // 우리 투석기 둘: 성 안 본성 앞
  if(B.ctx.kind==="siege")for(const sx of [-1,1]){const p=wPt(sx*0.35,CW.R*0.62);B.engines.push({side:0,x:p.x,z:p.z,hp:400,max:400,cd:rnd(4,7),face:Math.PI,armT:0});}
  // 망자 투석기: 병력이 많을수록 늘어난다(2~3)
  const men=B.sq.filter(s=>s.side===1).reduce((a,s)=>a+s.alive,0),n=men>4400*FOE_K?4:men>3600*FOE_K?3:men>1500*FOE_K?2:0;   // 큰 군세일수록 투석기가 늘어난다
  for(let i=0;i<n;i++){const a=n===1?0:-0.7+1.4*i/(n-1),p=wPt(a,-64);B.engines.push({side:1,atk:true,x:clamp(p.x,-112,112),z:clamp(p.z,-80,80),hp:260,max:260,cd:rnd(6,10),face:Math.atan2(CW.x-p.x,CW.z-p.z),armT:0});}
}
const engAlive=e=>e.hp>0;
function engineTick(dt){const B=BT;if(!B.engines)return;
  for(const e of B.engines){if(!engAlive(e))continue;if(e.armT>0)e.armT-=dt;
    // 부서지기: 붙은 적 근접병이 친다, 화살도 조금 박힌다
    for(const q of B.sq){if(!act(q)||q.side===e.side||q.state==="rout")continue;const d=Math.hypot(q.x-e.x,q.z-e.z);
      if(!isRng(q.t)&&d<sqR(q)+4){e.hp-=q.alive/(q.side===1?FOE_K:1)*0.25*dt*(U[q.t].tags.includes("cavalry")?1.6:1);}
      else if(isRng(q.t)&&!e.ram&&d<rangeOf(q)&&q.shootT!==undefined&&B.t-q.shootT<0.1)e.hp-=q.alive*0.006;}
    if(e.hp<=0){e.hp=0;e.deadT=B.t;if(!B.headless){B.fx.push({k:"dust",x:e.x,z:e.z,t0:B.t,dur:2});E.shake=Math.max(E.shake||0,0.12);}const nm=e.ram?"충차":"투석기";bSay(e.side===1?`망자의 ${nm}를 부쉈다!`:`우리 ${nm}가 부서졌다!`);B.log.push(e.side===1?`적 ${nm} 파괴`:`아군 ${nm} 파괴`);continue;}
    if(e.ram){ramTick(e,dt);continue;}
    e.cd-=dt;if(e.cd>0)continue;
    if(e.atk){// 성벽(대부분) 또는 성 안 빽빽한 곳
      e.cd=rnd(8,11);let tx,tz,wallSeg=null;
      const inside=B.sq.filter(q=>act(q)&&q.side!==e.side&&wIn(q.x,q.z)>WALL_T()+2);
      if(inside.length&&Math.random()<0.3){const q=inside[Math.floor(Math.random()*inside.length)];tx=q.x+rnd(-4,4);tz=q.z+rnd(-4,4);}
      else{const near=B.wall.segs.filter(g=>g.hp>0&&!g.back).sort((a,b)=>angD(a.ac,wAng(e.x,e.z))-angD(b.ac,wAng(e.x,e.z)));wallSeg=e.side===0?near.slice(0,3).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]:near[Math.floor(Math.random()*Math.min(3,near.length))];if(!wallSeg)continue;const p=wPt(wallSeg.ac+rnd(-0.05,0.05),WALL_T()*0.5);tx=p.x;tz=p.z;}
      launchStone(e,tx,tz,wallSeg);if(!B.engSaid&&e.side===1){B.engSaid=true;bSay("망자의 투석기가 성벽을 친다 — 성문을 열고 기병을 내보내 부숴라 (성문 열기)");}}
    else{// 성벽 밖, 가장 빽빽한 망자 무리
      const fs=B.sq.filter(f=>act(f)&&f.side!==e.side&&wIn(f.x,f.z)<-2&&Math.hypot(f.x-e.x,f.z-e.z)<140);if(!fs.length){e.cd=2;continue;}
      let best=null,bs=-1;for(const f of fs){let sum=0;for(const g of fs)if(dd(f,g)<14)sum+=g.alive*(g.t==="troll"?3:1);if(sum>bs){bs=sum;best=f;}}
      e.cd=rnd(6,8);launchStone(e,best.x+rnd(-3,3),best.z+rnd(-3,3),null);}}
}
function launchStone(e,tx,tz,seg){const B=BT,d=Math.hypot(tx-e.x,tz-e.z),dur=0.9+d/38;e.armT=0.6;e.face=Math.atan2(tx-e.x,tz-e.z);
  if(!B.headless){B.proj.push({x0:e.x,z0:e.z,x1:tx,z1:tz,t0:B.t+0.15,dur,k:"stone",h0:3.5});if(BT.kingPos&&Math.hypot(BT.kingPos.x-e.x,BT.kingPos.z-e.z)<70)try{sfx("kick",0.7);}catch(x){}}
  B.pend.push({at:B.t+0.15+dur,fn:()=>{if(BT!==B)return;stoneHit(e.side,tx,tz,seg);}});}
function stoneHit(side,x,z,seg){const B=BT,R=7;
  if(seg&&seg.hp>0){seg.hp-=seg.max*(0.07+0.03*Math.random());if(seg.hp<=0){seg.hp=0;breachSeg(seg);}}
  for(const q of B.sq){if(!act(q)||q.side===side)continue;const d=Math.hypot(q.x-x,q.z-z);if(d>R+sqR(q))continue;const k=1-Math.min(1,Math.max(0,d-sqR(q))/R);
    bDamage(null,q,sqHp(q)*(q.side===1?(q.t==="troll"?1.5:3.5):(4))*k);q.morale-=6*k;if(k>0.2)bPop(q,onWallTop(q)?"성벽 위로 돌이 떨어졌다!":"투석기 돌에 맞았다!",q.side===0?"bad":"good");}
  if(!B.headless){for(let i=0;i<12;i++){const a=Math.random()*6.28,r=2+Math.random()*7;B.proj.push({x0:x,z0:z,x1:x+Math.cos(a)*r,z1:z+Math.sin(a)*r,t0:B.t,dur:0.45+Math.random()*0.5,k:"chip",arc:1.5+Math.random()*3.5,sz:0.35+Math.random()*0.6,h0:seg?wallH()*0.6:0,col:seg?"#8a8478":"#6a6052"});}
    B.booms.push({x,z,r:R});B.fx.push({k:"dust",x,z,t0:B.t,dur:1.6},{k:"dust",x:x+rnd(-3,3),z:z+rnd(-3,3),t0:B.t,dur:1.3});
    const kp=B.kingPos,cd=kp&&E.camMode==="tp"?Math.hypot(kp.x-x,kp.z-z):(E.ctrl&&E.ctrl.t?Math.hypot(E.ctrl.t.x-x,E.ctrl.t.z-z):99);if(cd<50)E.shake=Math.max(E.shake||0,0.18);try{sfx("kick",0.8);}catch(x){}}}

// 성벽 위·뒤의 우리 병사가 던지는 돌(보이게)
function rockVisual(s,e){if(BT.headless||Math.random()>0.06)return;const a=wAng(s.x,s.z),p=wPt(a+rnd(-0.03,0.03),WALL_T()*0.4);BT.proj.push({x0:p.x,z0:p.z,x1:e.x+rnd(-3,3),z1:e.z+rnd(-3,3),t0:BT.t,dur:0.7,k:"rock",h0:wallH()+1});}

/* ── 그리기: 투석기 모형 · 돌 맞은 자리 병사 튕기기 ── */
function engineMesh(side){const g=new THREE.Group();const wood=new THREE.MeshStandardMaterial({color:side?"#3a2a1e":"#7a5a36",roughness:1}),iron=new THREE.MeshStandardMaterial({color:"#3a3634",roughness:0.6,metalness:0.6});
  const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o;};
  box(3.2,0.4,5,wood,0,0.9,0);for(const sx of [-1.4,1.4])for(const sz of [-1.8,1.8]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.75,0.75,0.35,12),wood);wh.rotation.z=Math.PI/2;wh.position.set(sx*1.15,0.75,sz);g.add(wh);}
  for(const sx of [-1,1]){box(0.35,3.2,0.35,wood,sx*1.1,2.6,0.3);box(0.3,0.3,2.6,wood,sx*1.1,1.6,-0.5);}
  box(2.6,0.3,0.3,wood,0,4.1,0.3);
  const arm=new THREE.Group();arm.position.set(0,3.6,0.3);g.add(arm);const ab=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,6.5),wood);ab.position.set(0,0,-1.6);arm.add(ab);

      else if(st.state==="ok"){const v=vil(s.id);const tr=siteTrait(s.id);if(tr)info+=`<p class="note"><b>${tr.n}</b> — ${tr.d}</p>`;info+=`<dl class="kv"><dt>성벽</dt><dd>${v.walls?`돌 성벽 ${v.walls}단계`:"없음"}</dd><dt>수비대</dt><dd>${v.vgar.length?compsText(v.vgar):"없음"}${v.vq.length?` (훈련 중 ${v.vq.length})`:""}</dd></dl>`;
        acts=`${unl("village")?`<button class="b gold" data-a="village" data-id="${s.id}">마을 관리 (징병·성벽·투자)</button>`:lockedNote("village")}<button class="b" data-a="compose" data-t="site:${s.id}">수비군 파견</button>`;}}
    else if(s.kind==="rcapital"||s.kind==="rvillage"){const r=realmOf(s);ensureRealms();const R=S.realms[r.id];
      if(!R.alive)info=`<p class="note">무너진 왕국의 땅. 망자가 차지했다.</p>`;
      else{info=`<dl class="kv"><dt>왕국</dt><dd>${esc(r.name)} · ${esc(r.ruler)}</dd><dt>관계</dt><dd>${REL_NAME(R.rel)} (${Math.round(R.rel)})</dd><dt>인구</dt><dd>${st.state==="ok"?fmtN(st.pop):"폐허"}</dd>${s.kind==="rcapital"?`<dt>군대</dt><dd>${R.army.length}개 중대 · ${fmtN(R.army.reduce((a,c)=>a+c.men,0))}명</dd>`:""}</dl><p class="desc">${esc(r.desc)}</p>`;
        acts=unl("diplo")?`<button class="b gold" data-a="diplo" data-id="${r.id}">외교</button>`:lockedNote("diplo");}}
    else if(s.kind==="neutral"){
      info=`<p class="desc"><b style="color:var(--gold)">조건</b> · ${esc(s.pitch)}</p>`+(st.state==="joined"?`<p class="note">이미 왕국의 편이다.</p>`:"");

    else{ if(st.state==="razed")info=`<p class="note">무너진 요새. 역병의 기운이 옅어지고 있다.</p>`;
      else{const wk=activeWeak(s.id);info=foeViewHtml(s)+(wk.length?`<p class="note" style="color:var(--gold)">약점 ${wk.length}곳 파악: ${wk.map(k=>WEAK[k].n).join(", ")}</p>`:"");acts=`<button class="b red" data-a="compose" data-t="site:${s.id}">공략 원정</button>`+spyButtons(s);}}
    if(s.kind==="capital")acts=`<button class="b" data-a="home">왕궁으로 간다</button>`+acts;
    if(!siteSeen(s)){info=`<p class="note">안개에 가려 있다. 군대나 첩자를 보내야 무엇이 있는지 알 수 있다.</p>`;acts=`<button class="b gold" data-a="scout" data-id="${s.id}" ${(opAt(s.id)||spyFree()<=0)?"disabled":""}>${opAt(s.id)?"첩자가 가는 중":`첩자를 보내 알아본다 · 금화 ${Math.round(spyCost()*0.6)}`}</button><button class="b" data-a="compose" data-t="ground:${s.x}:${s.z}">군대를 보내 정찰</button>`;html=`${winHead("미지의 땅")}<div class="body"><h2>?</h2>${info}<div class="acts">${acts}</div></div>`;el.innerHTML=html;el.hidden=false;el.className="side panel";return;}
    html=`${winHead(SITE_KIND_NAME[s.kind])}<div class="body"><h2>${esc(s.name)}</h2><p class="desc">${esc(s.desc)}</p>${info}${acts?`<div class="acts">${acts}</div>`:""}</div>`;
  } else if(o.kind==="army"){const a=armyById(o.id);if(!a){UI.sel=null;el.hidden=true;return;}

      html=`${winHead("원정군")}<div class="body"><div style="display:flex;gap:12px;align-items:center"><span class="seal">${g.seal}</span><div><h2>${esc(armyName(a))}</h2><span class="kind">${esc(g.title)}</span></div></div>
        <dl class="kv"><dt>임무</dt><dd>${esc(missionName(a))}</dd><dt>도착</dt><dd>${a.moving?`약 ${eta}일`:"현지 주둔"}</dd></dl><p class="hint" style="margin:4px 0 6px">땅을 <kbd>우클릭</kbd>하면 그곳으로 이동해 야영 · 거점·적군을 우클릭하면 그 임무</p>${forceHtml("병력",a.comps)}
        ${(()=>{if(a.moving)return "";const vs=villagesOwned().filter(v=>S.sites[v.id].state==="ok"&&Math.hypot(v.x-a.x,v.z-a.z)<ALLY_R);if(!vs.length)return "";return vs.map(v=>{const st=S.sites[v.id];return `<div class="tile"><div class="eyebrow" style="margin-bottom:4px">${esc(v.name)}이(가) 가까이 있다 — 마을이 군대를 돕는다</div><div class="acts">
          <button class="b sm" data-a="vjoin" data-id="${v.id}" data-a2="${a.id}" ${st.vgar&&st.vgar.length?"":"disabled"} title="마을 수비대가 이 군대에 합류한다">수비대 합류 (${st.vgar?st.vgar.length:0}개 중대)</button>
          <button class="b sm" data-a="vlevyArmy" data-id="${v.id}" data-a2="${a.id}" ${st.pop>=300&&S.res.gold>=40&&S.res.food>=25?"":"disabled"} title="마을 사람 100명이 민병이 되어 합류한다 (금화 40·식량 25)">마을 징병 합류 (인구 ${fmtN(st.pop)})</button></div></div>`;}).join("");})()}
        ${a.moving?(()=>{const lv=a.rush||0;const why=lv>=3?"최대 단계":S.res.gold<200?"금화가 모자란다":S.res.food<200?"식량이 모자란다":"";return `<div class="tile"><div class="hd"><span class="nm">강행군 ${lv?`${lv}단계 · 속도 +${lv*25}%`:""}</span><span class="note" style="margin-left:auto">금화 200 · 식량 200</span></div><div class="ds">수레를 더 붙이고 쉬는 시간을 줄인다. 단계마다 이번 행군 속도 +25% (최대 3단계, +75%). 도착하면 풀리고, 단계마다 병사 피로 +6.</div><button class="b sm gold" data-a="rush" data-id="${a.id}" ${why?"disabled":""}>${why||`강행군 ${lv+1}단계`}</button></div>`;})():""}
        ${a.safeUntil>nowD()?`<p class="note">퇴각 중 — 한동안 적에게 붙잡히지 않는다</p>`:""}
        <div class="acts"><button class="b" data-a="retarget" data-id="${a.id}">목표 변경</button><button class="b" data-a="campT" data-id="${a.id}" title="지도의 아무 곳이나 눌러 보낸다. 우클릭으로도 보낼 수 있다">이동</button>${S.armies.some(x=>x.side===0&&x!==a)?`<button class="b" data-a="joinT" data-id="${a.id}">다른 군대와 합류</button>`:""}${a.mission!=="return"?`<button class="b" data-a="recall" data-id="${a.id}">귀환</button>`:""}</div></div>`;}
    else html=`${winHead("망자의 군세")}<div class="body"><h2>망자의 군세</h2><dl class="kv"><dt>행동</dt><dd>${esc(missionName(a))}</dd>${a.moving?`<dt>도착</dt><dd>약 ${eta}일</dd>`:""}</dl>${forceHtml("병력 (정찰 추정)",a.comps,true)}
      <div class="acts"><button class="b red" data-a="compose" data-t="army:${a.id}">요격 원정</button></div></div>`;
  }
  el.innerHTML=html;el.hidden=false;el.className="side panel";
}
function forceHtml(title,cs,foe){
  const o={};for(const c of cs){o[c.t]=o[c.t]||{n:0,men:0};o[c.t].n++;o[c.t].men+=c.men;}
  const rows=Object.entries(o).map(([t,v])=>`<div class="frow"><span class="glyph" style="background:${U[t].col}">${U[t].g}</span>${U[t].n}${foe?"":` <span class="note">${v.n}개 중대</span>`}<span class="n">${foe?"~":""}${fmtN(foe?Math.round(v.men/50)*50||v.men:v.men)}</span></div>`).join("");
  return `<div><div class="eyebrow" style="margin-bottom:6px">${title} · ${fmtN(compMen(cs))}</div><div class="force">${rows||'<span class="note">없음</span>'}</div></div>`;
}

function compAvail(){const av={};S.garrison.forEach((c,i)=>{const k=c.t+"#"+Math.min(3,c.vet||0);(av[k]=av[k]||[]).push(i);});for(const k in av)av[k].sort((a,b)=>S.garrison[b].men-S.garrison[a].men);return av;}
function draftPicked(d){const av=compAvail();return Object.entries(d.n).flatMap(([k,n])=>av[k]?av[k].slice(0,n):[]);}
function draftSetType(d,t,n){const av=compAvail();for(const v of [3,2,1,0]){const k=t+"#"+v,h=(av[k]||[]).length,take=Math.min(n,h);if(take>0)d.n[k]=take;n-=take;if(n<=0)break;}}   /* 추천 편성은 ★ 높은 중대부터 */

function describeTarget(t){if(t.kind==="ground")return "야영지 ("+Math.round(t.x)+", "+Math.round(t.z)+")";if(t.kind==="site")return siteById(t.id).name+" ("+({attack:"공략",rescue:"구출",guard:"수비",recruit:"포섭",return:"귀환"}[(missionFor(t,true)||{}).m]||"이동")+")";const a=armyById(t.id);return a?(a.side===1?"망자의 군세 요격":fixJosa(`${armyName(a)}와(과) 합류`)):"";}
function targetForces(t){if(t.kind==="ground")return null;if(t.kind==="army"){const a=armyById(t.id);return a&&a.side===1?a.comps:null;}const s=siteById(t.id),st=S.sites[s.id];
  if((s.kind==="fortress"||s.kind==="throne")&&st.state==="active")return S.intel&&S.intel[s.id]&&S.intel[s.id].comps?S.intel[s.id].comps:null;if(s.kind==="village"&&st.state==="besieged"){const sg=S.armies.find(a=>a.side===1&&a.mission==="siege"&&a.target===s.id);return sg?sg.comps:null;}return null;}
function openCompose(target,genId){
  const ready=genId?S.gens.find(g=>g.id===genId):S.gens.find(g=>g.status==="ready");
  UI.draft={gen:ready?ready.id:(kingHome()&&!(S.kingWound>0)?"king":null),n:{},target:target||null,vpick:{}};
  // 목표에 맞춰 추천 편성
  if(target){const foe=targetForces(target);if(foe){const cnt=countBy(foe);const want={inf:0,spear:0,archer:0,cav:0,priest:0};
      for(const [t,n] of Object.entries(cnt)){if(t==="orc")want.inf+=n;if(t==="troll"||t==="wolf")want.spear+=n;if(t==="ghoul"||t==="goblin")want.archer+=Math.ceil(n/2),want.inf+=Math.floor(n/2);if(t==="necro")want.cav+=1,want.priest+=1;}
      for(const t in want)draftSetType(UI.draft,t,want[t]);}
    else{const avail=countBy(S.garrison);for(const t in avail)draftSetType(UI.draft,t,Math.min(avail[t],2));}}

}

  const sc=new THREE.Scene();sc.background=new THREE.Color("#1a1612");sc.add(new THREE.HemisphereLight(0xfff0dd,0x302820,1.1));const dl=new THREE.DirectionalLight(0xffe6c8,1.6);dl.position.set(2,4,5);sc.add(dl);const dl2=new THREE.DirectionalLight(0x9fb4ff,0.6);dl2.position.set(-3,2,-2);sc.add(dl2);
  const m=makeKing(id);if(!m)return null;if(m.userData.hero){heroSheathe(m,false);const H2=m.userData.hero;H2.mixer.update(0.4);}m.rotation.y=0.45;sc.add(m);m.updateMatrixWorld(true);
  const cam=new THREE.PerspectiveCamera(30,W/H,0.1,50);cam.position.set(0,1.35,5.6);cam.lookAt(0,1.08,0);
  const rt=new THREE.WebGLRenderTarget(W,H);rt.texture.encoding=THREE.sRGBEncoding;const r=E.renderer,prev=r.getRenderTarget();r.setRenderTarget(rt);r.clear();r.render(sc,cam);
  const px=new Uint8Array(W*H*4);r.readRenderTargetPixels(rt,0,0,W,H,px);r.setRenderTarget(prev);rt.dispose();
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d"),img=cx.createImageData(W,H);for(let y=0;y<H;y++)img.data.set(px.subarray((H-1-y)*W*4,(H-y)*W*4),y*W*4);cx.putImageData(img,0,0);
  return SKIN_THUMB[id]=cv.toDataURL("image/jpeg",0.85);}catch(e){console.warn(e);return null;}}

function toggleBattleView(force){if(!BT||!BT.cmd)return;const toTp=(force!==undefined?force:E.camMode!=="tp")&&!!BT.king&&!BT.kingDown&&!KC.ko;if(!toTp)hideKingHud();if(!toTp&&E.camMode!=="tp"&&force===undefined){bSay(BT.king?"왕이 쓰러져 친위대가 뒤로 모셨다 — 전체 시점으로 지휘한다.":"장군이 이끄는 전투는 전체 시점으로 지휘한다.");return;}   // 장군이 이끌면 전체 시점만
  if(!toTp){setCamMode("rts");const os=bOurs().filter(s=>act(s)&&s.state!=="rout");const cx=os.length?os.reduce((a,s)=>a+s.x,0)/os.length:cmdPos().x,cz=os.length?os.reduce((a,s)=>a+s.z,0)/os.length:cmdPos().z;E.ctrl.set(cx,cz-22,105,0,0.56,true);}   // 전체 시점: 우리 진영 뒤 높은 곳에서 비스듬히 전장을 내려다본다

  ["성벽을 올린다","20일째 대습격이 왕궁으로 온다. 성벽 단계마다 방어전 아군 피해 -12%, 궁병이 성벽 위에서 내려쏜다.","내정 → 건설 → 성벽 (하루 걸린다)",S.bld.walls>0||!!(S.bq&&S.bq.walls)],
  ["정예 중대를 키운다","★★ 중대를 7일 더 단련하면 정예가 된다 — 정예보병·정예창병·정예궁병·정예기마병. 비싸고 느리지만 전투를 뒤집는다.","중대를 두 번 단련(★★)한 뒤, 내정 → 주둔군 탭 → 정예화 (금화 700·식량 250)",allComps().some(c=>c.elite||c.eliteT>0)],

].map((it,i)=>{if((T.skip2||[]).includes(i))it[3]=true;return it;});}
  // [제목, 왜 하는가, 어떻게, 완료 조건]
  return [
  ["왕궁을 걸어 본다","왕은 직접 움직이는 몸이다. 첫 7일은 망자가 오지 않으니 성 안을 익혀 두자.",(COARSE?"왼쪽 아래 조이스틱으로 걷고, 화면을 끌어 둘러본다 · 건물 앞에 서면 아래에 뜨는 버튼을 눌러 들어간다":"WASD 이동 · Shift 달리기 · 화면을 한 번 클릭하면 마우스로 시점이 돈다(Esc를 누르면 커서가 나온다) · 건물 앞에서 E로 문을 연다"),(T.walk||0)>25],

  ["전쟁 탁자에서 지도를 편다","왕국 전체는 지도에서 다스린다. 마을·요새·이웃 왕국이 거기 있다.","대전 앞 탁자에서 E, 또는 M. 돌아올 때도 M",!!UI.mapSeen],

  ["건물을 한 단계 올린다","건물 단계가 곧 징병 속도·세금·식량·인구다. 금화가 남으면 먼저 여기에 쓴다.","아래 '내정' → 건설. 농장(식량)·시장(금화)·주거지(백성)부터",bldSum>T.bld0||!!(S.bq&&Object.keys(S.bq).length)],
  ["병사를 징병한다","주둔군이 곧 왕궁의 방패다. 훈련엔 며칠이 걸리니 공격이 오기 전에 미리.","병영 문(E) 또는 내정 → 징병. 보병·창병·궁병을 섞어라",S.queue.length>0||S.garrison.length>8],
  ["사건에 답한다","세상은 가만있지 않는다. 상인·피난민·척후대·늑대… 사건이 오면 게임이 멈추고 선택지를 묻는다. 군대를 보내야 하는 사건은 '지도에서 본다'를 누르면 지도로 가서 군대를 고르게 된다. 급하지 않으면 '하루 뒤에 다시 듣는다'로 미룰 수 있다.","잠시 뒤 어부들이 찾아온다. 선택지 하나를 고르면 된다",!!T.evDone],
  ["중대를 단련한다","갓 뽑은 중대는 약하다. 단련으로 ★을 달면 공격·방어가 오르고, ★★이면 정예(보병·창병·궁병·기마병)로 키울 수 있다.","내정 → 징병 탭의 '부대 단련' 목록에서 중대 하나를 단련 (금화 70·식량 30·2일). 병영 문(E)에서도 된다. 정예화는 주둔군 탭",S.garrison.some(c=>(c.vet||0)>0||c.drill>0||c.elite||c.eliteT>0)],
  ["마을에 투자한다","마을 인구가 세금과 식량, 그리고 마을 징병의 바탕이다. 광산·세관은 매일 금화를 더 준다.","금빛으로 깜빡이는 광산·강변 마을을 클릭 → 마을 관리 → 광산 확장/세관. 마을 징병이나 성벽을 쌓아도 된다",villagesOwned().some(v=>{const st=S.sites[v.id];return st.mine||st.toll||st.mineT||st.tollT||(st.vgar&&st.vgar.length)||(st.vq&&st.vq.length)||st.wallQ;})],
  ["마을에 수비군을 보낸다","망자는 먼 마을부터 포위한다. 수비대가 있으면 며칠을 더 버티고, 원군이 갈 시간이 생긴다.","지도에서 마을 → 수비군 파견 (왕궁 주둔군에서 떼어 보낸다)",S.armies.some(a=>a.side===0&&a.mission==="guard")||SITES.some(s=>s.kind==="village"&&S.sites[s.id].vgar&&S.sites[s.id].vgar.length)],
  ["요새에 첩자를 보낸다","적의 수와 병종을 알면 상성에 맞춰 군대를 짤 수 있다.","지도 북쪽의 요새 모르가쉬(처음부터 보인다)를 클릭 → 첩자. 안개 속 '?'는 클릭해서 첩자를 보내면 무엇인지 알아낸다",S.spy.ops.length>0||Object.keys(S.intel||{}).length>0],
  ["이웃 왕국에 사절을 보낸다","관계 40이면 교역·조약, 70이면 원군을 빌릴 수 있다. 사절은 금화가 들지 않는다.","지도에서 이웃 수도 클릭 → 사절 파견. 5일마다 한 번",Object.values(S.realms||{}).some(r=>r.envD||r.pact||r.rel>=40)],
  ["콜로세움에서 장군과 대련한다","대련은 무예와 장군 경험을 함께 올리고 금화도 준다.","서쪽 콜로세움 문에서 E → 장군을 고른다. 한 판을 끝내면(이기든 지든) 통과. 상대는 왕의 무예에 맞춰 힘을 조절한다",(S.duelDone||0)>0],
].map((it,i)=>{if((T.skip||[]).includes(i))it[3]=true;return it;});}
function renderGuide(){try{tutNowTick();}catch(e){}{const jb=$("#jobMarks");if(jb&&UI.mode!=="map")jb.hidden=true;}const el=$("#guide");if(!el||!S)return;const ph=guidePhase();const off=ph===1?S.guideOff:ph===2?S.guide2Off:true;
  if(off||!(UI.mode==="capital"||UI.mode==="map"||UI.mode==="palace")){el.hidden=true;document.querySelectorAll(".gglow").forEach(e=>e.classList.remove("gglow"));return;}
  S.tut=S.tut||{};if(S.tut.ph!==ph){S.tut.ph=ph;S.tut.curI=undefined;S.tut.pend=undefined;}
  const items=guideItems();if(items.every(i=>i[3])){if(ph===1)S.guideOff=true;else S.guide2Off=true;el.hidden=true;toast(ph===1?"첫 주 길잡이를 모두 마쳤다. 이제 망자의 요새를 노려라.":"둘째 주 길잡이를 마쳤다. 이제 왕국은 네 손에 있다.");return;}
  const done=items.filter(i=>i[3]).length,cur=items.find(i=>!i[3]),ci=items.indexOf(cur);
  try{guideGlow(ph,ci,cur);}catch(e){}
  if(S.day===7&&!S.tut.warned){S.tut.warned=true;toast("오늘이 준비의 마지막 날 — 내일부터 망자가 움직인다. 길잡이는 밤에 사라진다.");}
  if(S.tut.curI!==ci){if(S.tut.curI!==undefined&&ci>S.tut.curI)sfx("cheer",0.15);S.tut.curI=ci;S.tut.open=true;S.tut.calm=0;S.tut.pendT=Date.now();if(true)S.tut.pend=ci;else{S.tut.pend=undefined;const g=$("#guide");if(g){g.classList.remove("flash");void g.offsetWidth;g.classList.add("flash");}}const pp=UI.mode==="capital"?CAP.pos:UI.mode==="palace"?PAL.pos:null;S.tut.pendPos=pp?{mode:UI.mode,x:pp.x,z:pp.z}:null;}
  // 안내창은 '하던 일을 마치고 자리를 떴을 때' 뜬다: 상호작용 원 밖으로 나가고, 완료한 자리에서 7m 이상 멀어졌을 때
  // 사건 단계: 안내창을 본 뒤 조용할 때 어부 사건을 하나 띄운다
  if(cur&&cur[0]==="사건에 답한다"&&!S.tut.evFired&&S.tut.pend===undefined&&!UI.modalOpen&&!DUEL.on&&!BT&&UI.mode!=="palace"){S.tut.evFired=true;setTimeout(()=>{if(!UI.modalOpen&&!BT&&!DUEL.on)fireEvent("fish");else S.tut.evFired=false;},2500);}
  // 다음 할 일 안내: 앞 단계를 마치고 창이 닫히면 바로(약 1초 뒤) 띄운다
  if(S.tut.pend!==undefined&&!UI.modalOpen&&!DUEL.on&&!BT&&(UI.mode==="capital"||UI.mode==="palace"||UI.mode==="map")){
    S.tut.calm=(S.tut.calm||0)+1;
    /* 다음 안내는 앞 단계를 마치고 숨 돌릴 틈(12초)을 둔 뒤에 — 너무 급하지 않게 (첫 안내는 바로) */
    if(S.tut.calm>=2&&(S.tut.pend===0||Date.now()-(S.tut.pendT||0)>12000)){S.tut.calm=0;const i=S.tut.pend;S.tut.pend=undefined;tutHerald(i,items[i],items.length,i>0&&items[i-1][3]?items[i-1][0]:null);}}
  const html=`<div class="gh"><span>${guidePhase()===2?"둘째 주 길잡이":"첫 주 길잡이"}</span><em>${done}/${items.length}</em><button data-a="guideSkip" title="이 단계 건너뛰기">건너뛰기</button><button data-a="guideFold" title="접기/펴기">${S.tut.open?"▾":"▸"}</button><button data-a="guideOff" title="숨기기">✕</button></div>
    <div class="gcur"><b>${ci+1}</b><span>${cur[0]}</span></div>
    ${S.tut.open?`<div class="ghow">${cur[2]}</div>`:""}
    <div class="gdots">${items.map((it,i)=>`<i class="${it[3]?"on":""}${i===ci?" cur":""}" title="${it[0]}"></i>`).join("")}</div>
    ${S.day<7?`<div class="gday">망자가 오기까지 ${7-S.day}일 — 지금은 준비할 때</div>`:S.day<20?`<div class="gday">첫 대습격까지 ${20-S.day}일</div>`:""}`;
  if(el._h!==html){el._h=html;el.innerHTML=html;}el.hidden=false;}

 ["0.9.113","지도 화면 돌리기: 오른쪽으로 끌면 오른쪽을 본다(왕 시점과 같은 방향, 방향키도), 두 손가락으로 돌릴 때·지도로 다시 올 때 한 바퀴 휙 도는 문제 수정 · 시간을 멈춘 동안엔 지도 보기·왕 움직이기만 — 내정·원정·상호작용 같은 명령은 ▶를 눌러야 한다"],
