 ["0.9.110","휴대폰: 오른쪽에 손가락 버튼(베기·찌르기·구르기·점프·막기·달리기·웅크리기·회오리·함성·돌진·무쌍·장군 기술·들어가기·말) — 왼쪽은 조이스틱 ·  가로 화면에서 HUD(왕 상태·길잡이·지도·버튼)를 줄여 화면을 덜 가린다, 세로로 들면 가로로 돌려 달라는 안내, 길잡이 첫 단계에 터치 조작 설명, 키보드 안내 숨김"],
 ["0.9.109","저장 관리에서 '이 날로 되돌리기'(자동 백업)를 없앴다 — 선택은 되돌릴 수 없다. 파일 내보내기·불러오기는 기기 옮기기용으로 남김"],
 ["0.9.108","PC 단독 실행판 준비: 창 전체 화면(F11), Esc는 커서만, 설정에 '게임 끄기', 망자의 군주는 내 Anthropic API 키로 연결(이 컴퓨터에만 저장) · 저장 파일 내려받기가 게시 페이지에서도 되도록 수정, 붙여 넣어 불러오기"],
 ["0.9.107","처음 화면의 'N일째'가 가끔 옛날 날짜로 뜨던 문제 수정(서버·이 기기 저장 중 더 최근 것을 쓴다) · 저장 관리(설정): 판을 파일로 내보내기·파일에서 불러오기 · 처음 화면에 '저장 파일 불러오기'"],
 ["0.9.106","자동 점검에서 찾은 것: 대습격이 출발한 요새를 거의 비워 그 요새가 거저 먹히던 문제(이제 수비의 3분의 1까지만 데려가고 나머지는 새로 일어난다) · 망자 군주의 출격도 요새 수비의 절반은 남긴다 · 돌아온 무리가 쌓여 모르가쉬가 1만 4천까지 불어나던 문제(요새마다 한도를 넘으면 흩어진다)"],
 ["0.9.105","대습격을 막을 때마다(1차만이 아니라 매번) 마을 공물이 커졌다: 금화 800+마을당 150, 식량 900+마을당 180 — 차수마다 +50% · 정예 양성을 여러 중대 동시에 (중대마다 금화 700·식량 250·7일)"],
 ["0.9.104","식량: 왕궁 병사 1명당 하루 0.05(2,000명당 -100), 원정군 1명당 0.15(1,000명당 -150) · 병영: 보병·창병 훈련 1단계 3일 → 2단계 2일 → 3단계(최고) 1일 · 이웃 왕국으로 가던 망자를 길에서 요격해 이기면 그 왕국이 사례금(금화 200~350)과 관계 +12를 준다"],
 ["0.9.103","식량 /일은 마을 공물까지 합친 하루 평균으로(식량은 대부분 마을에서 나서 왕궁 몫만 보면 늘 -로 보였다, 금화는 왕궁 몫만) · 원정군 식량은 왕궁 병사의 2배→1.5배 · 병종 기술이 실제로 티가 나게: 불화살 피해 5.5배(10초 동안 망자 수백), 집중 사격 궁병 공격 ×2.6, 투창 피해 약 6배(한 중대가 망자 백여 명), 밀어붙이기 +80%, 측면 돌격 ×2.2, 돌파 경보병 ×2.4·그 밖 ×1.6, 전열 정비 받는 피해 -40% (12초 동안 처치 수: 불화살 +49%, 집중 사격 +31% 측정) · 백성이 줄면 손해: 백성이 왕궁 한도의 60% 아래면 일손이 모자라 농장·시장이 덜 돌고(최저 35%), 병사가 백성의 60%를 넘으면 민심이 매일 -1.5 (기록으로 경고) · 떠돌이 장군이 적어도 20일에 한 번은 온다(첫 번째는 10일째쯤) · 몸값을 금화 900~1,500에서 350~550으로 · 금화가 들어오는 사건 다섯 가지 추가: 밀린 세금(다그치면 더, 민심 -), 상인 길드 헌금, 은맥 발견(한꺼번에 또는 열흘 동안), 귀족의 전쟁세, 버려진 수레"],
 ["0.9.102","대전 옷장에서 갈아입으면 그 자리에서 바로 바뀐다 · 시작하고 조금 뒤 '왕국의 살림' 안내 — 위쪽 칸 /일은 왕궁 몫, 마을 몫은 사흘마다 공물, 금고 쓰는 법"],
 ["0.9.101","위쪽 자원 칸의 /일은 왕궁 몫만 — 마을 몫은 사흘마다 공물로 · 왕궁 수입을 올렸다(백성 세금 약 1.8배, 시장 단계마다 금화 45→65)"],
 ["0.9.100","마을 수입은 마을마다 쌓였다가 사흘마다 공물로 왕궁에 들어온다(마을별 금액이 기록에 남고 알림이 뜬다) — 마을을 누르면 하루 수입과 쌓인 공물이 보인다 · 이웃 왕국은 자기 병력의 1.5배까지만 막는다"],
 ["0.9.99","이웃 왕국이 망자에게 공격받으면 우리에게 원군을 청한다(사이가 나쁘면 청하지 않는다) — '원군 보내기'로 바로 편성, 망자가 닿기 전에 근처에 세워 두면 함께 싸우고 이기면 관계 +12와 사례금"],
 ["0.9.98","공성: 근접 무리가 궁병 줄에 막혀 성벽 앞에서 제자리걸음하던 문제 수정 · 성벽에 닿은 사다리 무리는 맡은 자리를 고집하지 않고 그 자리에 사다리 · 성문이 열려도 모두 성문 한 곳에 줄 서지 않는다 · 궁병과 투창은 성벽 위 망자부터 노린다 · 고블린이 없는 요새도 수비의 3분의 1이 성벽에 올라 던진다 · 망자 요새 수비 1.5배(모르가쉬 제외, 진행 중인 판에도) · 대습격이 차수마다 크게 는다(2차 약 1만) · 이웃 왕국도 며칠마다 망자에게 공격받는다 · 금고에서 금화로 식량을 산다(하루 한 번, 파는 값의 두 배) · 싸우다 성벽이 무너지면 성벽 단계가 0으로 · 새 갑주가 열리면 알려 준다"],
 ["0.9.97","원정 편성에서 같은 병종도 단련 정도별로 따로 고른다(신병 · ★ · ★★ · ★★★ — 줄마다 공격·방어 보너스 표시, 추천 편성은 ★ 높은 중대부터) · 수비대 없는 마을은 성벽만으로 망자를 이기지 못한다: 민병은 아주 작은 무리만 쫓아내고(성벽 단계마다 조금 더), 나머지는 포위 — 성벽 단계마다 버티는 날 +3일 (예전엔 성벽 1단계 민병 40명이 망자 400을 막아 냈다) · 강 북쪽에 있던 회색골·소금길 여관·호숫가 어촌을 강 남쪽으로 옮겼다 — 이제 모든 마을이 강 아래"],
 ["0.9.96","왕의 중상 페널티를 '말을 못 탄다'만 남겼다 (걷기·달리기·칼·대련·체력은 그대로)"],
 ["0.9.95","비: 빗줄기를 절반으로 줄이고 가늘고 희미하게, 실제 빗속도로 비스듬히 — 정신없던 굵은 빗발 정리 · 대습격을 막아 내면 이튿날쯤 마을들이 공물을 가져온다(금화 500+마을당 130, 식량 600+마을당 160, 백성, 명성) · 그 뒤 열흘은 상인·일감·수확·피난민 사건이 더 자주 온다 · 2차 대습격은 그대로 40일째 · 왕의 발걸음(병영·궁술장·마구간·성당): 훈련 하루 단축 대신 그 건물 병종 중대 하나를 그 자리에서 단련(★+1, 비용 없음, ★★까지 · 단련 중이면 바로 끝남) · 왕이 중상이면 왕궁에서 말을 탈 수 없다 (왼쪽 위에 남은 날) · 수녀원에서 '왕의 상처를 돌본다'(금화 80, 하루 한 번, -4일) · 기본 화면 밝기를 22% 밝게 (설정 밝기 1 = 예전 1.22)"],
 ["0.9.94","대습격 D-n 옆 망자 수가 실제와 맞게: 계획 전엔 지금 병종 비율로 낸 추정(예전 공식은 망자 수 2배 이전 값이라 절반쯤으로 나왔다), 사흘 전부터는 실제 계획 수, 출발한 뒤엔 다가오는 군세의 실제 수"],
 ["0.9.93","강행군: 행군 중인 우리 군대를 눌러 금화 200·식량 200마다 속도 +25% (최대 3단계, +75%) — 도착하면 풀리고 단계마다 피로 +6 · 모르가쉬(가장 가까운 요새)를 약하게: 처음 망자 약 1,000(구울 3·고블린 2 중대), 느리게 늘고 최대 9중대 · 요새에서 군세가 출격하면 남은 수비 병력을 알려 준다 — 1,600 이하면 '요새가 비었다, 지금 치면 쉽다' (요새를 통째로 비우진 않는다) · 우리 군대 행군 속도 +35% (보병·혼성 185→250, 기병만 360→430 — 망자는 130 그대로): 마을을 치러 오는 망자를 따라잡아 막을 수 있게 · 안개 날씨를 없앴다(맑음·비·폭풍만)"],
 ["0.9.91","처음 여는 창마다(내정 탭 다섯, 원정·군대·장군·전황·연대기·옷장·대장간·대전 신하들·마을·이웃 왕국·건물) 맨 위에 '처음 보는 창' 설명 — '알겠다'를 누르면 사라진다 · 사건 창의 '하루 뒤에 다시 듣는다'를 없애고 '나중에 듣는다'로 — 오른쪽 아래 '미룬 요청'에 바로 들어가 언제든 듣거나 '거절'로 지운다 · 말: 말을 탄 채 지도를 폈다 돌아오면 그대로 말 위, 내린 말이 엉뚱한 자리에 서서 통과되고 안 타지던 문제 수정"],
 ["0.9.91","시작 금화 1400 → 2200 · 왕궁 건물에 '왕의 발걸음' — 직접 찾아가야만 하는 일(건물마다 하루 한 번): 병영·궁술장·마구간·성당은 훈련 중인 중대를 하루 당기고, 시장은 식량을 더 비싸게(500→금화 200) 팔고, 농장은 수확을 늘리고, 주거지는 민심 +3 · 처음 하는 사람을 위한 안내 카드: 왕의 말, 왕의 발걸음, 대장간·옷장의 갑옷, 금고(대출·식량 판매) · 왕궁·대전 아래에 'Esc — 커서 보이기'를 늘 띄운다"],
 ["0.9.91","콜로세움: 대련 중 장군과 몸이 겹치지 않는다 · 장군이 왕의 무예에 맞춰 힘을 조절한다(낮으면 봐주고, 높으면 전력) — 결투장 창에 표시 · 대련 중엔 길잡이 표식이 문 앞에 뜨지 않는다 · 길잡이 마지막 단계는 대련을 한 판 끝내면(승패 무관) 통과"],
 ["0.9.91","길잡이: 지금 눌러야 할 곳이 금빛으로 깜빡인다 — 왕궁 장소, 지도의 마을·요새, 버튼, 내정 탭까지. 다른 화면으로 가야 하면 그 이동 버튼(왕궁으로 · 지도 · 대전 입구 · 성채 마당으로)부터 빛난다 · 대전 안에서는 재무대신·재상이 빛난다"],
 ["0.9.90","급한 수정: 0.9.88부터 지도와 전투 전체 시점 카메라가 움직이지 않던 문제(지도를 펴면 숲속 땅바닥이 보이던 원인) · 왕궁·대전에서 마우스 안내: 화면을 클릭하면 마우스로 둘러보고, Esc를 누르면 커서가 나온다는 안내가 화면 아래에 뜬다 · 성벽 안쪽에 계단이 생겼다 — 성 안 땅에 있는 궁병은 계단으로 성벽에 오르고, 성 안에 들어온 적은 땅에 싸울 상대가 없으면 계단으로 성벽 위에 올라가 궁병을 친다(성벽 위 궁병만 남아 끝나지 않던 싸움 해결)"],
 ["0.9.89","마우스: 기본을 다시 '잠금 시점'으로 — 화면을 클릭하면 커서가 숨고 마우스를 움직이는 대로 시점이 돈다(Esc로 풀림). 설정에서 '커서 보이며 시점'으로 바꿀 수 있다 · 길잡이: 앞 단계를 마치면 다음 할 일 안내가 바로(약 1초 뒤) 뜬다 — 모든 단계에서 · 지도를 다시 펼칠 때 마을 화면 등의 카메라 값이 남아 땅바닥 숲속에 처박히던 문제 수정(마지막으로 보던 지도 자리로 돌아간다) · 사다리로 올라온 망자가 성벽 위 궁병을 확실히 깎는다(한 판에 궁병 절반 넘게) — 대신 우리 병사 강함을 조금 올려 대습격 균형을 맞췄다"],
 ["0.9.88","커서를 보인 채 둘러볼 때 화면이 더 매끄럽게 돈다 — 마우스 감도를 잠금 모드와 같게, 이름표·안내 글씨 위를 지나도 회전이 끊기지 않게(버튼·창 위에서만 멈춘다), 화면 가장자리 회전은 가장자리에 가까울수록 빨라지고 부드럽게 붙고 멎는다"],
 ["0.9.87","망자의 왕이 너무 빨리 쓰러지던 문제: 체력을 크게 늘리고 화살에 잘 안 쓰러지게(칼로 베어야 한다) — 시체 소환·광폭 단계가 제대로 나온다 · 왕이 깨우는 졸개 수 계산 오류 수정 · 전투 첫 설명 창은 배치 중에만 뜬다(싸움 도중에 갑자기 뜨지 않게)"],
 ["0.9.86","망자의 군주가 우리 약점을 짚는다 — 출격할 때 앞서 달려온 망자 전령이 성벽 없는 마을·빈 수비대·멀리 나간 군대·모자란 병종 같은 실제 약점을 외친다 · 다음 출격 엿보기: 군주는 이틀 앞서 출격을 계획한다. 그 요새에 첩자가 들어가 있으면(또는 그때 들어가면) 어디서 무엇이 어디로 갈지, 군주의 속셈과 약점까지 미리 알려 준다 · 전투 종류마다 처음 한 번 설명(들판·왕궁 방어·마을 방어·요새 공략·왕좌) · 병종 기술·부대 능력·장군 능력을 처음 쓰면 무엇이 바뀌고 화면에서 무엇이 보이는지, 언제 다시 쓰는지 알려 준다 · 도움말의 낡은 설명(장군 직접 조종 등) 정리"],
 ["0.9.85","Claude 연결이 안 될 때 'Claude 없이 시작 (출시 전 임시)' 버튼 — 허락 창 문제는 출시 단계에서 고친다"],
 ["0.9.84","궁술장·병영·마구간·성당 앞에서 E를 눌러도 창이 안 열리던 문제 수정(징병 비용 계산 오류) · 음악이 지직거리던 문제: 소리 버퍼를 넉넉히 잡아 화면이 바쁠 때도 끊기지 않게, 마지막에 리미터를 달아 소리가 겹쳐도 찢어지지 않게, 화음이 다 줄어들기 전에 끊겨 '딱' 소리가 나던 것 수정"],
 ["0.9.83","요새 공략: 사다리는 보병·창병만 오른다 — 기병은 성벽이 뚫릴 때까지 기다리고, 궁병은 성벽 밖에서 쏜다(돌격 명령을 받은 근위 기병이 사다리 역할을 받던 문제 수정) · Claude 연결: 기다리는 동안 몇 초째인지 보이는 창을 띄우고, 25초가 지나면 이유와 다시 연결 버튼을 보여 준다. 저장용 사용자 확인은 Claude 허락을 받은 뒤에 해서 허락 창끼리 겹치지 않게 했다"],
 ["0.9.82","트롤이 목표 구간이 막혀 성벽 앞에서 제자리걸음하던 문제 수정 — 붙은 자리의 성벽을 바로 두들긴다 · 사다리 꼭대기에 닿은 적은 먼저 성벽 위 궁병을 덮친다(성벽 위 궁병이 줄어든다) · 투석기 돌: 울퉁불퉁한 바위가 굴러 날아가며 흙먼지 꼬리를 남기고, 떨어진 곳에 돌 파편이 튄다. 맞은 성벽은 금이 가고 발치에 부스러기가 쌓이며(더 맞으면 더 깊게), 성벽 위 궁병·성 안 병사가 맞으면 다친다 · 보병이 요새 공략의 주인공: 방패를 이고 사다리를 가장 빨리·덜 떨어지며 오르고(창병·궁병은 느리고 잘 떨어진다), 넘어가면 방패로 밀어붙인다. 충차는 창병이 민다 · 인형이 덜 겹치게 몸 간격을 넓혔다 · 화질이 흐려지지 않게(자동 화질 조절이 1배 밑으로 내려가지 않는다), 대신 망자 인형 수를 조금 줄였다"],
 ["0.9.81","Claude 연결: 연결할 때 전체 화면을 먼저 끈다(허락 창이 가려지지 않게) · 20초 안에 답이 없으면 무한히 기다리지 않고 이유와 '다시 연결' 버튼을 보여 준다 · 페이지가 막 열려 Claude를 찾는 중에 눌러도 기다렸다가 연결한다"],
 ["0.9.80","망자의 군주는 이제 무조건 당신의 Claude가 지휘한다 — 게임(새로 시작·이어 하기·전투 연습)을 시작할 때 Claude 연결을 확인하고, 연결이 없으면 시작하지 않는다(설정의 기본 규칙 선택지 삭제) · 왕이 쓰러지면 친위대가 왕을 둘러싸고 뒤로 물러난다(쫓아오는 적만 친다) · 들판 연습 전투 망자 수를 조금 줄였다(지휘 없이는 지고, 지휘하면 이긴다)"],
 ["0.9.79","전투 전면 재점검: 수비 이점은 능력치가 아니라 전술에서 — 성벽 위 망자가 사다리·충차 아래로 불단지를 쏟고(6초간 불바다, 충차도 탄다) 뼈창·돌을 던지며 사다리를 밀어낸다. 성 안 수비병 피해 감소·왕궁 성벽 보너스 같은 숫자 보너스는 없앴다 · 성이 함락되는 조건: 성 안에 들어온 망자가 남은 수비대보다 확실히 강한 채 20초 · 망자도 흔들린다: 두목·강령술사를 잃거나 겁을 먹으면 공격이 약해졌다가 천천히 회복(달아나진 않는다) · 공성 중 병종 돌격(G)이 적 성문을 여는 문제, 후퇴(H)가 적 요새 안으로 들어가던 문제, 성벽 건너편으로 이동 명령 시 벽에 붙어 멈추던 문제(이제 성문·틈으로 돌아가고 못 가면 성벽 앞에서 멈춤) 수정 · 사다리로 넘어간 병사가 전투 뒤 사라지던 문제 수정 · 쓰러진 왕이 다시 싸우던 모습 수정 · 패주한 부대가 맵 끝에 멈춰 서 있던 문제, 마을 안 패주 부대가 울타리에 막히던 문제 수정 · 새로 깨어난 망자도 사다리·성벽 역할을 받는다 · 성문은 성문 부수기 무리·트롤·충차만 친다 · 공성 궁병은 보이는 적만 노리고, 안 보이면 성벽 사거리까지 다가가 기다린다 · 투석기·충차는 왕도 통과 못한다 · G 버튼과 G 키가 같은 동작(고른 부대, 없으면 지휘 중인 병종) · 장군 능력 오라 표시 보강"],
 ["0.9.78","성을 지키는 쪽이 훨씬 유리하다: 성 안 수비병은 피해를 덜 받고, 사다리로 갓 넘어온 무리는 에워싸여 크게 다친다. 망자 요새는 성벽 수비 보너스까지 있어 1,100명으로 3,000명이 지키는 요새는 못 뺏는다(두 배 넘는 병력이나 좋은 지휘가 필요) · 대습격 무리는 30% 더 빽빽하다(1차 약 9,000명) — 막을 수는 있지만 크게 잃으며 힘겹게 막는다"],
 ["0.9.76","망자 요새 공성전: 요새(모르가쉬 등)를 칠 때 둥근 성벽과 성문이 생긴다 · 우리 쪽에 투석기 둘과 충차 하나 — 보병 한 무리가 충차를 밀어 성문을 들이받고, 나머지 보병·창병은 성벽 곳곳에 사다리를 걸어 넘는다. 투석기는 가장 약한 성벽을 친다. 기병은 성이 뚫릴 때까지 성문 앞에서 기다리다가 뚫린 곳으로 들어간다 · 궁병은 성 밖에서 성벽 위와 바로 안쪽만 넘겨 쏜다(깊숙한 곳은 안 보인다) · 망자는 요새 안에서 넘어온 병사부터 치고, 사다리가 걸린 곳·성문 안쪽에 나눠 서서 막는다. 망자 투석기 하나가 성 밖 우리 군을 친다 · 왕과 근위대는 우리 진영에서 시작한다 · 망자 요새는 검게 그을린 돌, 성벽 위 쇠가시, 탑의 가시 왕관과 녹색 불꽃, 성문 위 거대한 해골, 성 밖 해골 말뚝, 뒤편의 검은 성채, 잿빛 하늘로 확 다르다 · 망자 땅(요새·왕좌 공략, 지도 북쪽)은 풀 없이 잿빛 황무지 — 마른 나무, 불탄 자국, 흩어진 뼈 · 고친 것: 성 안 망자 무리가 성벽에 붙어 제자리걸음하던 것, 막혀서 못 가는 병사가 계속 뛰는 시늉을 하던 것, 자동 전투 때 궁병이 다가가지 않던 것"],
 ["0.9.77","망자는 이제 훨씬 많다(같은 무리가 두 배 병력, 화면의 좀비도 더 빽빽하다) — 대신 우리 병사 한 명 한 명이 그만큼 강하다. 수로 밀리는 싸움을 병사의 힘과 지휘로 이긴다 · 망자 요새도 우리 왕국처럼 뒤가 검은 바위산인 반원 성이다 · 요새 수비: 고블린이 성벽 위에서 다가오는 우리 병사에게 뼈창과 돌을 던지고, 근접병은 성문과 앞쪽 성벽 안쪽을 지키며 사다리로 넘어온 병사부터 친다 · 투석기·충차는 병사가 뚫고 지나가지 못한다 · 장군이 이끄는 전투는 정말로 전체 시점으로만 지휘한다(장군은 근위대와 함께 알아서 싸운다) · 전투 중에도 오른쪽 위에 도움말·설정 버튼(열면 잠시 멈춘다), 전투 연습에는 '연습 끝내기' 버튼"],
 ["0.9.76","망자 요새 공략이 진짜 공성전이 됐다: 요새는 검게 그을린 원형 성벽과 성문으로 둘러싸이고, 우리 보병 한 무리가 충차를 밀어 성문을 들이받고, 보병·창병은 성벽 곳곳에 사다리를 걸어 넘어가며, 투석기 둘이 성벽을 깬다. 궁병은 성벽 밖에서 성벽 위와 바로 안쪽만 넘겨 쏘고, 기병은 뚫린 곳으로 돌아 들어간다 · 망자는 요새 안에서 넘어온 병사부터 치고, 사다리가 걸린 곳과 성문 안쪽에 나눠 막는다 · 망자 요새는 쇠가시·해골 말뚝·녹색 화로·뒤편 검은 성채로 음산하게, 망자 땅은 전장과 지도 모두 잔디 없이 잿빛으로 갈라진 맨흙 · 장군이 이끄는 전투는 전체 시점으로만 지휘한다"],
 ["0.9.75","마을 방어전: 마을을 빙 둘러싼 원형 통나무 울타리(1단계), 집은 울타리 안에, 궁병은 울타리 위에 빙 둘러 고르게 · 망자는 세 작전 중 하나 — 사방 포위(빙 둘러 사다리) · 약한 곳 찌르기(성벽 위 궁병이 가장 적은 쪽으로 몰림) · 정면 공격 — 성벽을 뚫고 직진하지 않고 바깥 둘레를 따라 돌아간다 · 궁병의 시야: 성벽 위에서는 자기 앞쪽 바깥(±50°)만 쏠 수 있고 성 안 땅에서는 성벽 너머를 못 쏜다 — 보이는 적이 없으면 성벽을 따라 적이 있는 쪽으로 옮겨 간다(고르게 세우면 한 곳의 화력은 약해진다) · 성문 부수기 무리가 성문 앞에서 닿지 않아 끝나지 않던 전투 고침 · 대습격 균형: 큰 군세일수록 망자 투석기 2→4대, 투석기 돌이 성벽을 더 깎는다 · 전투 연습에 '마을 방어전' 추가 · 막혀서 못 가는 무리가 제자리걸음하던 것 고침"],
 ["0.9.74","성 공방전 재정비 — 망자가 역할을 나눈다: 트롤은 약한 성벽 한 구간을 두드려 깨고, 오크 절반·늑대는 성문을 부수고, 구울·고블린·나머지 오크는 성벽 곳곳에 사다리를 걸어 두 줄로 늘어서 차례로 오른다(사다리가 모자라면 뒤에서 기다린다 — 아무 데나 성벽에 박치기하지 않는다) · 사다리 꼭대기에서 성벽 위 궁병이 지키면 많이 밀려 떨어지고, 비어 있으면 몇 명씩 넘어와 안에 새 무리로 뛰어내려 싸운다 · 투석기: 성 안에 우리 투석기 둘(가장 빽빽한 망자 무리에 돌), 망자 뒤편에 투석기 2~3대(성벽을 깨고 가끔 성 안으로) — 돌 맞은 자리 병사들이 튕겨 나간다, 성문을 열면 기병이 나가 망자 투석기를 부순다 · 성벽 가까이 있는 보병·창병은 돌을 던진다(보인다)"],
 ["0.9.73","망자의 진형: 트롤이 맨 앞에 서고 나머지는 그 뒤에 숨어 트롤 걸음에 맞춰 따라온다 — 트롤이 부딪히거나 성벽에 닿거나 성벽이 뚫리면(또는 45초) 일제히 덮친다(우리 군이 가까우면 기다리지 않고 싸운다) · 사다리를 성벽 꼭대기까지 닿게 길게, 비스듬히 걸치고 망자가 사다리를 따라 오른다 · 어두운 땅에서 잘 안 보이던 좀비·오크·트롤·늑대·말 몸을 밝힘, 화면 가장자리 병사가 잘려 사라지던 것 줄임 · 균형: 왕이 쓰러질 때 사기 -30→-15, 사다리 넘기 조금 느리게(성벽 위 궁병이 있으면 더 느리게) — 시험 결과: 명령 없이 싸우면 들판 연습전 반반, 병종 기술을 쓰면 4전 4승"],
 ["0.9.72","왕(장군)이 쓰러지면 일어나지 않고 친위대가 끌어내며 2.5초 뒤 전체 시점으로 넘어간다 · 성 방어전: 오크·구울·고블린이 성벽에 붙어 사다리를 오르다가 성벽을 넘어 안으로 뛰어내려 싸운다(성벽 위에 궁병이 지키면 느리고 비면 빠르다), 트롤은 성벽을 부순다 · 전군 돌격에도 궁병은 그 자리(성벽 위)에서 계속 쏜다 · 기술이 눈에 보이게: 기술 쓴 부대 발밑에 기술마다 다른 색 빛고리(방패막 금빛·창벽 푸른빛·밀어붙이기 주황·돌파 붉은빛…)가 지속 시간 동안 맥박치고 머리 위에 외침, 불화살은 불붙은 화살 비가 날아가 떨어진 자리에 10초 동안 불길·연기, 집중 사격 대상엔 붉은 과녁, 기병 돌격·밀어붙이기엔 흙먼지 · 병사끼리 겹침 1/10로(병사 몸 넓이↑, 두 번 밀어내기) · 커서가 가끔 기본 화살표로 돌아가던 것 고침(커서 규칙끼리 부딪혀 화면 대부분에서 칼 커서가 꺼져 있었다)"],
 ["0.9.71","커서가 가끔 기본 화살표로 돌아가던 것 고침(커서 규칙끼리 부딪혀 화면 대부분에서 칼 커서가 꺼져 있었다) · 창병 절반(battalion 모델)이 새카만 그림자처럼 보이던 것 고침(뒤집힌 노멀맵) · 트롤끼리·트롤과 병사가 겹치지 않게 더 넓게 밀어낸다 · 찌르기·돌진 때 하얀 막대 같은 빛줄기 없앰 · 왕이 쓰러지면 말이 옆에서 숨 쉬며 서 있다 · 투창은 날아가 꽂힌 뒤 피해"],
 ["0.9.70","전투 정밀 점검(병사 하나하나를 자동 검사): 맞붙으면 각 병사가 가장 가까운 적 병사를 짝으로 잡아 달려들어 싸운다 — 등 뒤 적을 두고 먼 적에게 가지 않고, 두 무리는 서로 파고들어 한 덩어리로 섞인다(허공 칼질·멀뚱히 마주 선 병사 0.1% 아래로) · 병사는 제 걸음보다 빨리 미끄러지지 않는다 · 부딪힌 직후 1초는 피해가 천천히 올라 멀리서 쓰러지지 않는다 · 아군 부대에 막히면 옆으로 돌아 나간다 · 성벽: 병사 하나하나도 성벽을 뚫지 못하고, 망자는 성벽 앞에 2~3겹으로 몰려 성벽을 두드리며, 사다리를 오르다 꼭대기에서 수비병에게 밀려 떨어진다(수비병이 없으면 성벽이 더 빨리 무너진다) · 흙먼지가 하얀 빛 덩어리 대신 흙빛 연기로 · 시체는 쓰러진 뒤 땅으로 가라앉아 사라진다(성벽 위에서 죽으면 그 자리) · 후퇴 명령: 붙잡혀 있어도 빠져나가고(물러나는 동안 피해 -40%), 물러난 자리를 지킨다 · 방패막 중엔 자리를 지킨다 · 왕이 쓰러지면 말은 옆에 남아 서 있다 · 칼자국·타격 고리를 은은하게 · 화살은 어두운 나무색, 투창은 길고 굵게(날아가 꽂힌 뒤 피해) · 카메라 근처·싸움터 주변 나무는 치워 싸움이 보이게"],
 ["0.9.69","시체를 남기지 않는다: 쓰러지는 동작(1.3초)만 보이고 사라진다 — 죽은 늑대기수의 기수가 서 있던 것 없앰 · 말·늑대가 공격할 때 몸이 튀어 나가 기수와 떨어지던 것 고침(칼질은 기수만) · 왕을 쫓는 망자는 제 걸음 속도로만 따라온다(트롤이 말을 따라잡던 것) · 모든 병사·망자가 서로 겹치지 않게 밀어낸다(같은 편·다른 편, 트롤·기병은 더 넓게) · 왕의 성벽 충돌을 더 넓고 확실하게(말 탔을 땐 더 넓게)"],
 ["0.9.68","왕을 쫓는 망자: 한꺼번에 둘러싸는 수를 정하고(말 위 6, 걸을 때 9) 서로 밀어내 겹쳐 쌓이지 않게, 말 탄 왕·늑대·트롤은 더 넓게 둘러싼다 · 말 위에서 찌른 뒤 팔이 뻗은 채 남던 것 고침 · 버튼 위에서 커서가 기본 화살표로 돌아가던 것 고침"],
 ["0.9.67","말 위 찌르기: 몸통이 비틀리며 돌던 것 고침(말 머리 쪽으로 팔만 뻗는다) · 전투에선 마우스 움직임으로 시점이 도는 것 끔(예전처럼 끌어서 돌린다, 왕궁·대전은 그대로) · 가만히 선 병사가 제자리에서 달리던 것 고침 · 망자도 가까이(18m) 있는 우리 부대와 먼저 싸운다 · 왕(장군) 가까이 온 망자는 둘러싸고 실제로 칼질한다(멀뚱히 서 있지 않게) · 왕의 칼에 맞은 구울·고블린·늑대는 확실히 쓰러진다"],
 ["0.9.66","커서를 늘 보이게: Esc로 커서를 띄울 필요 없이, 화면 위에서 마우스를 움직이면 시점이 돌고(양 끝에 대면 계속 돈다, 버튼·창 위에선 안 돈다) 바로 클릭할 수 있다 — 왕궁·대전·전투 모두 같게 · 게임 커서: 쇠칼 모양(누를 수 있는 곳에선 금빛) · 전투에서도 왕궁처럼 마우스로 둘러보며 움직인다 · 왕이 쓰러질 때: 말 위에 뜬 채 쓰러지거나 친위대 자리로 순간이동하던 것 고침 — 쓰러진 자리에 누워 있고 친위대가 달려와 둘러싸며, 4초쯤 몸을 일으켜 5초에 다시 싸운다"],
 ["0.9.65","성을 반원으로: 본성(남쪽 끝)과 그 양옆 성벽이 반원 성벽의 두 끝과 이어지고, 성 뒤는 산 — 망자는 앞과 양옆에서만 온다 · 성 공방전 배치 구역 표시(파란 띠) 없앰, 왕·장군은 성 안 광장에 선다 · 부대가 서로 덜 겹치게: 병사 간격 20% 넓힘, 트롤 간격 크게, 부대끼리 밀어내는 힘 강화"],
 ["0.9.64","성을 원형으로: 성벽이 성을 빙 둘러싸고(이음 탑 16개), 북쪽에 문루와 두 짝 문이 달린 진짜 성문(열면 문이 열리고, 부서지면 무너진다). 망자는 반달 모양으로 에워싸 북·동·서에서 오고 아무 구간에나 사다리를 건다 · 성 안 보병·창병·기병은 성벽이 멀쩡하면 안에서 대기, 성문·성벽이 뚫리면 그 틈으로 달려가 막는다 · 궁병은 성벽 위 통로에 두 줄로 선다(공중에 뜨지 않게) · 상식대로 싸운다: 명령이 없어도 가까운 적이 오면 싸우고(명령 직후·따르라 중에도 가까이 온 적은 친다), 기술을 쓴 뒤 몇 초씩 멍하니 서 있던 것 고침 · 방진·산개·고수 버튼 삭제 · 망자는 혼자 다니는 왕(장군)에게도 덤벼든다 · 왕이 처음 쓰러지면 말에서 떨어지고 친위대가 5초 뒤 일으켜 세운다(체력 40%), 두 번째엔 실려 나간다 · 말 탄 왕이 너무 엎드리던 자세 바로잡음 · 기술 소리 교체: 북소리 명령(둥-둥), 방패 맞붙이는 소리, 일제 사격, 말발굽, 함성, 낮은 뿔피리"],
 ["0.9.63","전투 디테일 점검: 쓰러지는 병사가 실제로 맞은 병사다(근접은 지금 맞붙어 싸우던 병사, 왕의 칼은 칼끝에 있던 병사 — 뒷줄 병사가 대신 죽던 것 고침) · 왕의 칼에 맞은 적은 뒤로 밀려나고, 회오리·돌진·말발굽엔 공중으로 튕겨 나간다 · 성문·성벽이 뚫리면 성벽 너머 적만 노려보던 보병·창병이 틈을 막으러 간다 · 성벽 위 궁병은 땅의 망자 칼이 닿지 않는다(트롤 빼고) — 성문으로 들어온 망자가 성벽 위 궁병을 베던 것 · 성벽 위 궁병이 밀려 성 밖으로 떨어지던 것 고침 · 성벽·성문이 무너지면 그 위의 궁병은 가까운 성한 성벽으로 옮겨 간다(틈으로 떨어져 몰살당하던 것) · 숲이 카메라와 싸움 사이를 가리면 그 나무만 잠시 치운다 · 성벽 위에서 돌을 던지는 보병이 \'성벽에 막힘\'으로 보이던 것 → \'성벽 방어\' · 쏘고 있는 궁병이 '대기'로 보이던 것 → '사격' (밀어붙임·돌파 상태도 표시)"],
 ["0.9.62","영화(헬름 협곡·다섯 군대 전투)를 보고 전투 연출 손질: 적과 맞붙은 병사는 계속 싸운다(휘두르는 시점만 조금씩 다르게) · 적 몸을 뚫고 들어가지 않음 · 맞붙은 상태가 자꾸 끊겨 대열로 돌아가던 것 고침 · 부딪힘: 돌격·트롤에 맞은 앞줄이 밀려나고 공중으로 튕겨 나감 + 흙먼지·화면 흔들림 · 트롤은 휘두를 때마다 병사를 날려 버린다 · 화살 비: 한 번에 최대 24발, 더 높은 포물선 · 방패막·창벽은 어깨를 붙여 촘촘히 서서 방패를 든다 · 성벽 방어전: 망자가 사다리를 걸치고 기어오른다 · 말타기: 옆으로 게걸음 치지 않고 머리 쪽으로만 달린다, 방향은 천천히 꺾이고 속도가 붙었다 줄었다 함, S는 뒷걸음, 걸음에 맞춰 몸이 오르내리고 달리면 숙이고 꺾을 땐 안쪽으로 기울고 비탈에선 말이 고개를 숙인다 · 기병대 기수도 말 걸음에 맞춰 오르내린다"],

  ["왕의 기술",`무예가 오르면 열린다 — 1 회오리 베기(무예 10, 360도), 2 불굴의 외침(무예 25, 주변 아군 사기 +25·공격 +25%), 3 돌진 베기(무예 40, 일직선 꿰뚫기 ×2.5). 왕궁과 전장 왕 시점 모두에서 쓴다`],
  ["왕의 장비","왕궁 대장간에서 검(피해 +10%/단계)과 갑옷(체력 +12%·받는 피해 -5%/단계)을 벼린다. 단계마다 무예 8씩 더 필요하고 하루 걸린다. 최대 5단계"],
  ["알현(청원)","대전의 시종장에게 백성·상인·귀족·수도사가 청을 올린다. 이삼일마다 하나. 시종장 앞에서 E(또는 왕좌에 앉아) 대기 중인 청원을 차례로 듣고 선택지를 고른다 — 금화·식량·백성·민심·병력이 오르내린다. 미뤄도 사라지지 않는다"],

  ["작전도","전장 오른쪽 위 양피지 지도. Tab으로 크게 펼쳐 부대를 고르고(끌어서 상자 선택) 우클릭으로 이동·공격을 명한다. 고른 부대의 진군로가 먹 화살표로 그려진다. 위쪽 막대는 양군의 기세(병력×사기)"],
  ["적의 계략","망자는 전투마다 계략 하나를 쓴다 — 협공(좌우로 갈라 측면), 궁병 사냥(늑대·고블린이 우회해 궁병만), 쐐기(트롤·오크가 가장 약한 부대 하나로), 예비대(30%를 숨겼다 20초 뒤 옆구리로 투입), 거짓 후퇴(물러났다 사기 올려 되돌아옴), 성벽 깨기(트롤·오크가 가장 약한 성벽으로, 성벽 피해 +35%). 시작 7초 뒤 척후가 외치고 조언 창에 남는다"],
  ["망자의 군주","설정에서 Claude가 지휘하게 하면(시험판) 침공 목표·양동·대습격 구성·전투 계략을 Claude가 정한다. 지난 8번의 전투와 왕의 병력 구성을 보고 약한 곳을 노린다. 전투가 끝나면 사로잡은 전령이 속셈을 털어놓는다"],
  ["왕의 검술","익히면 강해진다 — ① 박자: 앞 베기가 끝나갈 무렵 누르면 더 빠르고 30% 세게 이어지고(금빛 불티), 미리 연타하면 연격이 끊긴다 ② 완벽한 막기: 맞기 직전 0.25초 안에 B를 누르면 기력 소모 없이 튕겨 내고 다음 일격 ×2, 결투 상대는 비틀거린다 ③ 완벽한 회피: 구르기 무적 중에 공격을 흘리면 찰나가 멈추고 기력 +30, 다음 일격 ×2"],
  ["타격감","왕의 칼이 박히면 피가 튀고 화면이 흔들리며 찰나 멈춘다. 막으면 불꽃이 튄다. 여러 명을 한꺼번에 벨수록 세다"],
  ["피로","원정·전투를 거듭하면 쌓인다. 피로 100이면 전투력 60%. 왕궁 주둔이나 야영(빈 땅에 군대 보내기)으로 푼다"],
  ["지역 할인","목장·깊은 숲·고원 마을을 가지고 있으면 기마병·궁병·창병 징병 금화가 싸진다"],
  ["단련·정예·승급","중대는 단련(★, ★★: 별당 공격 +8%·받는 피해 -6%)으로 키우고, ★★ 중대는 정예화(금화 700·식량 250·7일·여러 중대 동시에)로 정예보병(철벽·방어 5)·정예창병(기병·트롤 상대 3.6배)·정예궁병(사거리 82·연사)·정예기마병(체력 19·속도 13.5)이 된다 — 체력 19·공격 4.3·방어 3.5·속도 13.5, 모든 상성 유리, 창벽에만 약함. ★★★은 전투 승리로만 얻고, ★★★ 중대장은 대전에서 장군으로 승급할 수 있다"],
  ["징병 기간","병영 단계가 오를 때마다 보병·창병 훈련이 하루씩 짧아진다(최소 1일). 개량의 교련 체계도 하루씩 줄인다. 마을 징병은 마을 사람 100명을 민병으로 바꾼다"],
];
  return `${winHead("수치 설명")}<div class="wbody">${G.map(([n,d])=>`<div class="tile"><div class="hd"><span class="nm">${n}</span></div><div class="ds">${d}</div></div>`).join("")}</div><div class="wfoot"><button class="b ghost" data-a="close">닫기</button></div>`;}

// Deep Dark는 플레이어 자신의 Claude가 망자의 군주를 지휘해야 시작된다 — 연결이 없으면 시작하지 않는다
async function claudeGate(){
  if(window.__TEST||UI.gateSkip)return true;
  if(AI.ok()&&AI.checked)return true;
  if(!AI.sample&&AI.ready){toast("Claude를 찾는 중…");try{await AI.ready;}catch(e){}}
  if(AI.sample&&!AI.off){
    // 허락 창은 Claude 화면 쪽에 뜬다 — 게임이 전체 화면이면 가려지므로 먼저 전체 화면을 끈다
    try{if(document.fullscreenElement)await document.exitFullscreen();}catch(e){}
    let to,iv,sec=0;const wait=()=>`${winHead("Claude와 연결하는 중")}<div class="wbody"><p class="story" style="font-size:16px">망자의 군주를 지휘할 당신의 Claude를 부르고 있다… <b id="gateSec">${sec}</b>초</p><p class="note">처음이면 Claude 화면 쪽(게임 바깥)에 사용 허락 창이 뜬다. 허락하면 바로 시작한다.</p></div>`;
    UI.openModal(wait(),{blocking:true});iv=setInterval(()=>{sec++;const el=document.getElementById("gateSec");if(el)el.textContent=sec;},1000);
    let call;try{call=AI.text("'준비'라고만 답하라.").then(()=>"ok",e=>e);}catch(e){call=Promise.resolve(e);}
    const r=await Promise.race([call,new Promise(res=>{to=setTimeout(()=>res("timeout"),25000);})]);clearTimeout(to);clearInterval(iv);UI.modalBlocking=false;UI.closeModal();
    if(r==="ok"){AI.checked=true;UI.aiStatus();toast("Claude와 연결됐다");
      if(AI._db&&AI._usr&&!DB){try{UID=await AI._usr.id();if(UID){DB=AI._db;LOADED=await loadGame()||LOADED;}}catch(e){}}
      return true;}
    if(r!=="timeout"){AI.fail(r);if(!AI.off&&r&&r.code==="rate_limited"){AI.checked=true;return true;}UI.gateWhy=r&&r.code?`(${r.code})`:"";}
    else UI.gateWhy="timeout";}
  UI.openModal(`${winHead("Claude 연결이 필요하다")}<div class="wbody"><p class="story" style="font-size:16px">Deep Dark의 망자의 군주는 <b>당신의 Claude</b>가 직접 지휘한다. 왕국의 약점을 읽고, 지난 전투를 기억하고, 매번 다른 침공을 짠다.</p>
    <p class="note">${!AI.sample?"지금 화면에서는 Claude를 부를 수 없다. claude.ai에 로그인한 상태로 이 게임 페이지를 열어야 한다.":UI.gateWhy==="timeout"?"Claude의 대답을 25초 동안 기다렸지만 오지 않았다. 화면 위·아래에 허락 요청이 떠 있지 않은지 확인하고, 없으면 페이지를 새로고침한 뒤 다시 연결을 눌러라.":AI.off?"Claude 사용이 허락되지 않았다. 다시 연결을 누르고 허락 창에서 허락하라.":"Claude를 부르지 못했다 "+(UI.gateWhy||"")+" — 잠시 뒤 다시 연결을 눌러라."} 결정할 때마다 당신의 Claude 사용량이 조금 든다.</p>
    ${(window.deskApi||APP_MODE)&&!(window.claude&&window.claude.use)?`<div class="tile" style="margin-top:10px"><div class="hd"><span class="nm">앱: 내 Claude API 키로 연결</span></div><div class="ds">앱은 claude.ai 화면 밖이라, 내 Anthropic API 키로 Claude를 부른다. 키는 이 컴퓨터에만 저장되고 망자의 군주가 결정할 때마다 API 사용료가 조금 든다(console.anthropic.com에서 발급).</div><input id="apiKeyIn" type="password" placeholder="sk-ant-…" style="width:100%;margin-top:6px;padding:6px;background:#120e0a;color:#e8dcc0;border:1px solid rgba(226,192,122,.4)"><div class="acts" style="margin-top:6px"><button class="b gold" data-a="apiKeySave">키 저장하고 연결</button>${deskKey()?`<button class="b ghost" data-a="apiKeyDel">저장된 키 지우기</button>`:""}</div></div>`:""}
    <div class="acts" style="margin-top:12px"><button class="b gold" data-a="gateRetry">다시 연결</button><button class="b ghost" data-a="gateSkip" title="출시 전까지만 있는 임시 버튼">Claude 없이 시작 (출시 전 임시)</button></div></div>`,{blocking:false});
  return false;}
/* 연결 창(API 키 등)을 거쳐 연결되면, 처음 누른 것(싱글플레이·START·이어 하기)으로 바로 들어간다 — 다시 누를 필요 없다 */
function gateThen(fn){if(window.__TEST||UI.gateSkip||(AI.ok()&&AI.checked)){UI.gateNext=null;fn();return;}UI.gateNext=fn;claudeGate().then(ok=>{if(ok)gateGo();});}
function gateGo(){const f=UI.gateNext;UI.gateNext=null;if(f&&(!S||S.title)){f();return true;}return false;}

// 길잡이가 지금 단계에서 눌러야 할 곳을 금빛으로 깜빡이게 한다 (버튼·지도의 거점·왕궁의 문)
/* 눌러 본 버튼은 같은 단계에서 다시 빛나지 않는다 (창을 닫으면 다시 알려 준다) */
const glowSig=e=>e.dataset&&e.dataset.a?[e.dataset.a,e.dataset.k||"",e.dataset.id||"",e.dataset.t||""].join("|"):"";
document.addEventListener("click",e=>{const g=e.target.closest&&e.target.closest(".gglow:not(.lbl),.tut-glow");if(!g)return;UI.glowHit=UI.glowHit||new Set();const k=glowSig(g);if(k)UI.glowHit.add(k);g.classList.remove("gglow","tut-glow");},true);
function guideGlow(ph,ci,cur){document.querySelectorAll(".gglow").forEach(e=>e.classList.remove("gglow"));
  const gk=ph+":"+ci,mo=!!UI.modalOpen;if(UI.glowKey!==gk||(UI._glowModal&&!mo))UI.glowHit=new Set();UI.glowKey=gk;UI._glowModal=mo;
  if(!cur||cur[3])return;
  const add=sel=>document.querySelectorAll(sel).forEach(e=>{if(UI.glowHit.has(glowSig(e)))return;if(e.offsetParent!==null||e.classList.contains("lbl"))e.classList.add("gglow");});
  const spot=id=>{if(UI.mode==="capital"&&CAP.spots){const s=CAP.spots.find(x=>x.id===id);if(s&&s.el)s.el.classList.add("gglow");}};
  const site=fn=>{if(UI.mode!=="map")return;for(const st of SITES){if(fn(st)){const o=WR.siteObjs[st.id];if(o&&o.el)o.el.classList.add("gglow");}}};
  const pspot=id=>{if(UI.mode==="palace"&&PAL.spots){const s=PAL.spots.find(x=>x.id===id);if(s&&s.el)s.el.classList.add("gglow");}};
  const toCap=()=>{if(UI.mode==="map")add('[data-a="home"]');else if(UI.mode==="palace")pspot("door");};
  const toPal=()=>{if(UI.mode==="palace")return true;if(UI.mode==="capital")spot("keep");else toCap();return false;};
  const toMap=()=>{if(UI.mode==="capital"){spot("table");}if(UI.mode!=="map")add('[data-a="map"]');};
  const sel=UI.sel&&UI.sel.kind==="site"?siteById(UI.sel.id):null;const modal=UI.modalOpen;
  if(ph===1){switch(ci){
    case 0:toCap();break;
    case 1:toCap();spot("yard2");break;
    case 2:toMap();break;
    case 3:toPal();break;
    case 4:if(toPal())pspot("treas");break;
    case 5:if(!modal)add('[data-a="kingdom"]');add('[data-a="ktab"][data-k="build"]');break;
    case 6:if(!modal){add('[data-a="kingdom"]');spot("barracks");pspot("chan");}add('[data-a="ktab"][data-k="recruit"]');break;
    case 8:if(!modal)add('[data-a="kingdom"]');add('[data-a="ktab"][data-k="recruit"]');add('[data-a="drill"]');break;
    case 9:toMap();if(!sel||sel.kind!=="village")site(s=>{if(s.kind!=="village"||S.sites[s.id].state!=="ok"||!siteSeen(s))return false;const tr=siteTrait(s.id);return !!tr&&(tr.id==="ore"||tr.id==="river");});else add('[data-a="village"]');add('[data-a="vinvest"]');break;
    case 10:toMap();if(!sel||sel.kind!=="village")site(s=>s.kind==="village"&&S.sites[s.id].state==="ok"&&siteSeen(s));else add('[data-a="compose"][data-t^="site:v"]');break;
    case 11:toMap();if(!sel||(sel.kind!=="fortress"&&siteSeen(sel)))site(s=>s.id==="f_mor");else{add('[data-a="spy"]');add('[data-a="scout"]');}break;
    case 12:toMap();if(!sel||sel.kind!=="rcapital")site(s=>s.kind==="rcapital"&&siteSeen(s));else add('[data-a="diplo"]');add('[data-a="envoy"]');break;
    case 13:if(!DUEL.on){toCap();spot("duel");}break;}}
  else if(ph===2){switch(ci){
    case 0:if(!modal)add('[data-a="kingdom"]');add('[data-a="ktab"][data-k="tech"]');break;
    case 1:if(!modal)add('[data-a="kingdom"]');add('[data-a="ktab"][data-k="build"]');break;
    case 3:toMap();if(!sel||sel.id!=="f_mor")site(s=>s.id==="f_mor");else add('[data-a="compose"][data-t="site:f_mor"]');break;}}}

/* ════════ 로그인 (앱 전용): 구글 계정으로 저장을 클라우드에 — 폰·PC 어디서든 같은 왕국 ════════
   - claude.ai 안에서는 쓰지 않는다 (거기선 Claude 계정 저장이 이미 있다)

    <div class="tmenu" ${APP_MODE?"hidden":""}>
      ${has?`<button class="tb main" data-a="continue">CONTINUE<small>${LOADED.day}일째 · ${esc(LOADED.ruler||KING_NAME)} 왕</small></button>`:`<button class="tb main" data-a="start">START<small>선왕의 마지막 밤부터</small></button><button class="tb" data-a="startSkip" style="font-size:13px;opacity:.85">프롤로그 없이 시작<small>바로 1일째 왕궁에서</small></button>`}

    </div>

function startNewGame(fromPro){
  const name=KING_NAME;

  S.guideOff=true;S.guide2Off=true;S.guideAsk=true;tutAsk(15000);   /* 길잡이는 15초쯤 둘러본 뒤 할지 묻는다 */
  buildCapital();rebuildCapital(true);enterCapital();
  herald("즉위",`${fromPro?(UI.proWin===false?"성문이 부서지던 순간, 선왕이 홀로 막아서다 쓰러졌다. 그 희생에 망자는 물러갔다. ":"성벽은 지켰다. 그러나 선왕은 그 밤의 상처로 숨을 거뒀다. "):""}${name}이(가) 아스테라의 왕관을 쓴다. 20일째, 망자의 대군이 온다 — 그때까지 병사를 뽑고 성벽을 올려 막아내라. 그리고 북쪽 망자의 요새를 하나씩 무너뜨려라. (화면 위 막대: 대습격까지 남은 날과 병력)`);
  saveGame();
}
function continueGame(){S=LOADED;migrateState(S);if(S.guideAsk)tutAsk(8000);ensureRealms();ensureFog();S.paused=true;S.title=false;UI.sel=null;UI.camSaved=null;CAP.camInit=false;buildCapital();rebuildCapital(true);if(kingHome())enterCapital();else openMap();toast(`${S.day}일째에서 이어간다.`);}
// 전투 연습: 저장된 판을 건드리지 않고 정해진 전투 하나만 바로 해 본다 (끝나면 처음 화면으로)
const PRACTICE={

};
function practiceModal(){return `${winHead("전투 연습")}<div class="wbody"><p class="note" style="margin:0">지금 하던 판은 저장된 채 그대로다. 연습이 끝나면 처음 화면으로 돌아온다.</p>${Object.entries(PRACTICE).map(([k,p])=>`<button class="tile" data-a="practiceGo" data-k="${k}" style="text-align:left"><div class="hd"><span class="nm">${p.n}</span></div><div class="ds">${p.d}</div></button>`).join("")}</div><div class="wfoot"><button class="b ghost" data-a="close">닫기</button></div>`;}
function practiceStart(k){if(S&&!S.title&&!S.practice)saveGame();const skin=(S&&S.skin)||(LOADED&&LOADED.skin)||"ashen";
  newState();S.practice=true;S.title=false;S.ruler=KING_NAME;S.skin=skin;S.day=20;S.paused=true;S.guideOff=true;S.guide2Off=true;S.kingSkill=30;S.hints=Object.fromEntries(Object.keys(HINTS).map(k=>[k,1]));UI.sel=null;
  $("#title").hidden=true;UI.closeModal();UI.modalBlocking=false;
  const comps=(o)=>{const out=[];for(const [t,n] of o)for(let i=0;i<n;i++)out.push({t,men:U[t].men,vet:1});return out;};
  if(k==="siege"){S.bld.walls=2;S.garrison=comps([["inf",4],["spear",3],["archer",6],["cav",2],["militia",1]]);const foe=spawnArmy(1,comps([["ghoul",14],["goblin",8],["orc",5],["troll",2],["wolf",2]]),0,0,{mission:"raid",target:"capital"});foe.surge=1;startBattle({kind:"siege",foeArmy:foe,foes:foe.comps,title:"아스테라 공방전 (연습)"});}
  else if(k==="gen"){S.garrison=comps([["inf",3],["spear",3],["archer",3],["cav",2]]);const a=dispatch("eorin",S.garrison.map((_,i)=>i),{kind:"site",id:"f_mor"});startBattle({kind:"assault",site:"f_mor",our:a,foes:S.sites.f_mor.garrison,title:"모르가쉬 공략전 (연습)"});}
  else if(k==="village"){const vid="v_reed";const st=S.sites[vid];st.walls=1;st.state="ok";st.vgar=comps([["inf",2],["spear",1],["archer",2]]);const vs=siteById(vid);const foe=spawnArmy(1,comps([["ghoul",5],["goblin",2],["orc",1],["troll",1]]),vs.x,vs.z-10,{mission:"siege",target:vid});startBattle({kind:"vsiege",site:vid,foeArmy:foe,foes:foe.comps,title:"버드내 방어전 (연습)"});}
  else if(k==="elite"){S.garrison=comps([["einf",2],["espear",2],["earcher",2],["ecav",2]]);const a=dispatch("king",S.garrison.map((_,i)=>i),{kind:"ground",x:0,z:200});const foe=spawnArmy(1,comps([["orc",6],["troll",3],["ghoul",4]]),a.x,a.z-10,{mission:"raid",target:"capital"});startBattle({kind:"field",our:a,foeArmy:foe,foes:foe.comps,title:"정예병 시험 (연습)"});}
  else{S.garrison=comps([["inf",4],["spear",3],["archer",4],["cav",2]]);const a=dispatch("king",S.garrison.map((_,i)=>i),{kind:"ground",x:0,z:200});const foe=spawnArmy(1,comps([["ghoul",6],["goblin",4],["orc",2],["wolf",2],["troll",1]]),a.x,a.z-10,{mission:"raid",target:"capital"});startBattle({kind:"field",our:a,foeArmy:foe,foes:foe.comps,title:"들판의 회전 (연습)"});}
  setTimeout(()=>{if(WAR)beginBattle(true);},60);}
UI.inspect=s=>{const u=U[s.t];toast(`${u.n} ${s.alive}명 — ${u.d}`);};

/* ── 시작 ── */
(async function boot(){
  $("#title").hidden=false;$("#title").innerHTML=`<div class="tlogo" style="margin-top:28vh"><span class="tline"></span><h1 class="ttl">Deep Dark</h1><span class="tline"></span><p class="tsub">망자의 군단</p></div><div class="tmenu" style="margin-top:0;margin-bottom:auto"><div class="bar big" style="width:min(360px,80vw);height:6px;border:1px solid rgba(226,192,122,.4)"><i id="loadBar" style="width:2%;background:linear-gradient(90deg,#b88a3a,#ffe9b0)"></i></div><p class="tfoot" id="loadTxt">병사와 말을 깨우는 중…</p></div>`;
  window.onCharProgress=p=>{const b=$("#loadBar"),t=$("#loadTxt");if(b)b.style.width=Math.round(2+p.done/p.total*96)+"%";if(t)t.textContent=`병사와 말을 깨우는 중… ${p.done}/${p.total}`;};
  try{buildTextures();await Promise.all([loadPhotos(),loadChars()]);}catch(e){}
  try{buildMaterials();buildModels();initEngine();}catch(e){$("#title").hidden=false;$("#title").innerHTML=`<p class="tdesc">3D를 시작하지 못했다. 이 브라우저에서 WebGL을 켤 수 있는지 확인해 주세요.</p>`;console.error(e);return;}
  showTitle(true);
  AI.ready=(async()=>{if(window.claude&&window.claude.use){
    const [smp,db,usr]=await Promise.all([claude.use("sample").catch(()=>null),claude.use("db").catch(()=>null),claude.use("user").catch(()=>null)]);
    AI.sample=smp||AI.sample;AI._db=db;AI._usr=usr;   // 사용자 확인(저장용)은 Claude 허락을 받은 뒤에 한다 — 허락 창이 겹쳐 막히지 않게
    if(db&&usr&&!smp){try{UID=await usr.id();if(UID)DB=db;}catch(e){}}
  }})();
  await AI.ready;
  LOADED=await loadGame();
  if(S&&S.title)showTitle(false);
  UI.aiStatus();
})();

/* 길잡이를 할지 묻는다: 시작하고 조금 둘러본 뒤 — 창이 열려 있으면 닫힐 때까지 기다린다 */
function tutAsk(ms){setTimeout(function chk(){if(!S||!S.guideAsk||S.title||S.practice)return;if(UI.modalOpen||BT||!(UI.mode==="capital"||UI.mode==="palace"||UI.mode==="map")){setTimeout(chk,3000);return;}
  S.paused=true;UI.openModal(`${winHead("길잡이",false)}<div class="wbody"><p class="story" style="font-size:16px">첫 주 동안 할 일을 하나씩 안내하는 <b>길잡이</b>와 함께 하겠는가?</p><p class="note">왕궁 둘러보기 → 지도·신하 → 건설·징병 → 마을·첩자·외교 → 대련까지, 할 일을 하나씩 알려 주고 눌러야 할 곳을 빛나게 한다. 처음 하는 왕이라면 권한다. 나중에 설정에서 켜고 끌 수 있다.</p></div><div class="wfoot"><button class="b ghost" data-a="tutNo">혼자 해 보겠다</button><button class="b gold" data-a="tutYes">길잡이와 함께</button></div>`,{narrow:true,blocking:true});},ms);}

/* ════════ 저장 관리: 자동 백업 · 파일로 내보내기/가져오기 ════════ */
// 닷새마다 그 슬롯의 판을 백업해 둔다 (최근 3개) — 잘못 고른 선택·무너진 판을 되돌릴 수 있게
const bakKey=n=>`ashen-bak-${n||1}`;
function backupList(n){try{return JSON.parse(localStorage.getItem(bakKey(n))||"[]");}catch(e){return [];}}
function backupTick(){return;if(!S||S.practice||S.title)return;const d=S.day|0;if(d<2||d%5!==0)return;const L=backupList(S.slot);if(L.some(b=>b.day===d))return;
  try{L.unshift({day:d,at:Date.now(),snap:snapshotState()});localStorage.setItem(bakKey(S.slot),JSON.stringify(L.slice(0,3)));}catch(e){try{localStorage.setItem(bakKey(S.slot),JSON.stringify(L.slice(0,1)));}catch(e2){}}}
function loadSnap(raw,label){let s=null;try{s=typeof raw==="string"?JSON.parse(raw):raw;}catch(e){}
  if(!s||s.v!==2||!s.sites||!s.res){toast("저장 파일을 읽지 못했다 — Deep Dark 저장 파일이 맞는지 확인하라.");return false;}
  if(s.over){toast("이미 끝난 판이다.");return false;}
  s.slot=(S&&S.slot)||s.slot||1;s.skin=s.skin||"ashen";s.kingWound=s.kingWound||0;
  if(typeof BT!=="undefined"&&BT){toast("전투 중에는 불러올 수 없다.");return false;}
  UI.closeModal();UI.modalBlocking=false;LOADED=s;continueGame();saveGame();toast(`${label||"불러온 판"} — ${s.day}일째에서 이어간다.`);return true;}
async function exportSave(){if(!S||S.title||S.practice){toast("내보낼 판이 없다.");return;}saveGame();
  const fname=`DeepDark_${(S.ruler||"왕").replace(/[^\w가-힣]/g,"")}_${S.day}일째.json`,data=snapshotState();
  /* 게시된 페이지에서는 다운로드 권한(downloads)을 거쳐야 파일이 내려간다 */
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:fname,data});toast("저장 파일을 내려받았다.");return;}}catch(e){if(e&&/declin|cancel|reject/i.test(String(e.code||e.message||e))){toast("내려받기를 취소했다.");return;}}
  const blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("저장 파일을 내려받았다.");}
function importSave(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadSnap(r.result,"파일에서 불러온 판");r.readAsText(f);};inp.click();}
function saveMgmtHtml(){const inGame=S&&!S.title&&!S.practice;
  return `<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:8px">저장 관리</div>
    <p class="note" style="margin:0 0 6px">판은 늘 자동으로 저장된다. 파일로 내보내 두면 다른 기기(PC판 등)로 옮기거나 브라우저를 지운 뒤에도 이어 할 수 있다.</p>
    <div class="acts"><button class="b" data-a="saveExport" ${inGame?"":"disabled"}>파일로 내보내기</button><button class="b" data-a="saveImport">파일에서 불러오기</button><button class="b ghost" data-a="savePaste">붙여 넣어 불러오기</button></div>
  </div>`;}

/* 파일 선택이 막힌 곳(일부 브라우저·보기 창)을 위해: 저장 파일 내용을 붙여 넣어 불러온다 */
function pasteModal(){return `${winHead("붙여 넣어 불러오기")}<div class="wbody"><p class="note">내보낸 저장 파일(.json)을 메모장으로 열어 전부 복사한 뒤 아래에 붙여 넣는다.</p><textarea id="pasteSave" style="width:100%;height:160px;background:#120e0a;color:#e8dcc0;border:1px solid rgba(226,192,122,.4);font:12px monospace"></textarea><div class="acts" style="margin-top:8px"><button class="b gold" data-a="pasteGo">불러오기</button><button class="b ghost" data-a="settings">돌아가기</button></div></div>`;}

/* ════════ PC판(Electron): claude.ai 밖이므로 플레이어 자신의 API 키로 Claude를 부른다 — 게임 쪽 인터페이스(AI.sample)는 그대로 ════════ */
function deskKey(){try{return localStorage.getItem("dd-apikey")||"";}catch(e){return "";}}
function deskSample(key){
  const call=async(p,o={})=>{let r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:o.modelTier==="quick"||!o.modelTier?"claude-haiku-5-5":"claude-sonnet-5-5",max_tokens:o.maxTokens||1500,messages:[{role:"user",content:String(p)}]})});}catch(e){throw {code:"network",message:String(e)};}
    if(!r.ok){throw {code:r.status===401||r.status===403?"not_granted":r.status===429?"rate_limited":"http_"+r.status};}
    const j=await r.json();return (j.content||[]).map(c=>c.text||"").join("");};
  call.json=async(p,o={})=>{const t=await call(p+"\n\n설명 없이 JSON만 출력하라.",o);const m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t);};
  return call;}
if((window.deskApi||APP_MODE)&&!(window.claude&&window.claude.use)){const k=deskKey();if(k){AI.sample=deskSample(k);}}

/* 홈 화면 앱(PWA): 서비스 워커가 게임 파일을 담아 두고, 새 버전이 올라오면 다음 실행 때 바뀐다 */
if("serviceWorker" in navigator&&APP_MODE&&!window.deskApi&&location.protocol==="https:"){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
