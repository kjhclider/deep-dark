<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Dark 로그인</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0806;color:#efe4cc;font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.box{width:min(380px,92vw);padding:24px;background:#0f0e0d;border:1px solid rgba(240,228,205,.14);border-radius:3px;text-align:center}h1{font:700 22px/1.2 "Noto Serif KR",Georgia,serif;letter-spacing:.06em;color:#ebe1ca;margin:0 0 6px}p{margin:8px 0}
button{width:100%;margin-top:12px;padding:12px;font:700 16px/1 inherit;border-radius:4px;border:1px solid #c4a66a;background:#c4a66a;color:#15110a;cursor:pointer}button:disabled{opacity:.5}
input{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;font:700 20px/1 monospace;letter-spacing:.2em;text-align:center;text-transform:uppercase;background:#0a0806;color:#ffe2a0;border:1px solid #8a6d3a;border-radius:4px}
.code{font:800 26px/1.2 monospace;letter-spacing:.2em;color:#ffe2a0}.ok{color:#9fd08a;font-weight:700}.err{color:#ff8a7a}</style></head><body><div class="box">
<h1>DEEP DARK</h1>
<div id="cbox"></div><button id="go">Google로 로그인</button><p id="msg"></p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({"apiKey":"AIzaSyBSSv_puC2HNNnJ5X3pqv6Dx1PM3s-6GO8","authDomain":"deep-dark-dfa61.firebaseapp.com","projectId":"deep-dark-dfa61","storageBucket":"deep-dark-dfa61.firebasestorage.app","messagingSenderId":"436605364957","appId":"1:436605364957:web:2870ce5df98e5512a10934","databaseURL":"https://deep-dark-dfa61-default-rtdb.asia-southeast1.firebasedatabase.app"});
const q=new URLSearchParams(location.search);
const EN=(q.get("l")||navigator.language||"ko").slice(0,2)!=="ko";
const T=EN?{title:"Deep Dark sign-in",btn:"Sign in with Google",pick:"Choose your Google account and the game signs in by itself",enter:"Enter the 8-character code shown in the app",len:"The code has 8 characters",open:"Opening the Google window…",done:"Done. Go back to the game; it signs in by itself. You can close this window.",fail:"Failed: "}
 :{title:"Deep Dark 로그인",btn:"Google로 로그인",pick:"구글 계정을 고르면 게임으로 저절로 로그인된다",enter:"앱에 뜬 8자리 코드",len:"코드는 8자리다",open:"구글 창을 여는 중…",done:"완료. 게임으로 돌아가면 저절로 로그인된다. 이 창은 닫아도 된다.",fail:"실패: "};
document.title=T.title;document.documentElement.lang=EN?"en":"ko";document.getElementById("go").textContent=T.btn;let code=(q.get("c")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const cb=document.getElementById("cbox"),msg=document.getElementById("msg"),go=document.getElementById("go");
if(code.length===8)cb.innerHTML='<p>'+T.pick+'</p>';
else cb.innerHTML='<p>'+T.enter+'</p><input id="ci" maxlength="9" placeholder="ABCD-EFGH">';
go.onclick=async()=>{const ci=document.getElementById("ci");if(ci)code=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==8){msg.className="err";msg.textContent=T.len;return;}
  go.disabled=true;msg.className="";msg.textContent=T.open;
  try{const res=await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());const cr=res.credential||(firebase.auth.GoogleAuthProvider.credentialFromResult&&firebase.auth.GoogleAuthProvider.credentialFromResult(res));if(!cr||!cr.idToken)throw {code:"no-token"};
    await firebase.firestore().doc("linkSessions/"+code).set({idToken:cr.idToken,at:Date.now()});
    msg.className="ok";msg.textContent=T.done;go.style.display="none";setTimeout(()=>{try{window.close();}catch(e){}},1500);}
  catch(e){go.disabled=false;msg.className="err";msg.textContent=T.fail+(e&&e.code||e);}};
</script></body></html>
